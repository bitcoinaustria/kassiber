[workspace]
resolver = "2"
members = ["core", "python"]

[workspace.package]
version = "0.2.0"
edition = "2021"
# The repository's pinned toolchain (rust-toolchain.toml), which also builds
# ui-tauri/src-tauri.
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["Bitcoin Austria"]
publish = false

[profile.release]
# A panic is a bug; keep unwinding so the binding can turn it into an error.
panic = "unwind"
