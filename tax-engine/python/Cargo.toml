[package]
name = "kassiber-tax"
description = "Python binding for Kassiber's tax engine"
# Shared with kassiber-tax-core and pyproject.toml; bump them together.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors.workspace = true
publish.workspace = true

[lib]
# The Python import name; PyInit_kassiber_tax must match it.
name = "kassiber_tax"
crate-type = ["cdylib"]

[dependencies]
kassiber-custody = { path = "../../crates/custody" }
kassiber-tax-core = { path = "../core" }
# 0.25 dates from plan 20's Rust 1.77 pin, which the shared 1.99 toolchain
# replaced; moving to a newer line is its own change. >= 0.24.1 is
# required for RUSTSEC-2025-0020. abi3-py310 builds one wheel for every
# supported CPython (requires-python >= 3.10).
pyo3 = { version = "0.25.1", default-features = false, features = ["macros", "abi3-py310"] }
