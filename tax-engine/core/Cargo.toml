[package]
name = "kassiber-tax-core"
description = "Kassiber's tax engine: pure lot, pool, and gain computation"
# The engine's release.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "kassiber_tax_core"

[dependencies]
# The CPython-compatible decimal type, shared with the backend crates.
kassiber-pydecimal = { path = "../../crates/pydecimal" }
# The registry's calendars: a country's local dates count its holding
# periods. The engine reads no country code from it.
kassiber-tax-countries = { path = "../../crates/tax-countries" }
# The JSON boundary: request and response documents (schema_version 1).
# Cargo.lock holds serde at 1.0.228 because serde_derive 1.0.229 moved to
# syn 3, a second copy next to pyo3's syn 2.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Opt-in `Instant` spans for performance work; never enabled by the binding.
timing = []

[[example]]
name = "ledger-bench"
required-features = ["timing"]
