# The one Rust toolchain for every crate in this repository: the root Cargo
# workspace (the tax engine and crates/*) and the desktop app's own workspace
# (crates/kassiber-desktop). CI and release workflows install exactly this
# channel through .github/actions/setup-rust; see docs/plan/21-rust-backend.md.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
