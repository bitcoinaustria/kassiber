name: Set up the pinned Rust toolchain
description: >-
  Installs the channel rust-toolchain.toml pins, with rustfmt and clippy, and
  makes it the default, so every cargo, maturin, and Tauri build in the job
  uses exactly that toolchain. Optionally restores a shared Cargo cache. Run
  it after checkout.
inputs:
  cache-key:
    description: >-
      Restore the Cargo cache shared under this key: the registry and the
      root workspace's dependency builds, never its own crates, which Cargo
      rebuilds after every checkout anyway. Empty means no cache.
    required: false
    default: ""
  save-cache:
    description: >-
      "true" saves the cache after the job, on pushes to main only, so pull
      requests restore main's cache and never write their own. One job per
      key should save it.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install the pinned Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        # Tolerates CRLF checkouts on Windows runners.
        channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then
          echo "rust-toolchain.toml names no channel" >&2
          exit 1
        fi
        rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
        rustup default "$channel"
        rustc --version
        cargo --version

    # The bundled SQLCipher builds a vendored OpenSSL whose Configure needs a
    # full Perl. On Windows, Git Bash puts its own Perl first on PATH, which
    # lacks modules such as IPC::Cmd and Params::Check; the hosted runners
    # ship Strawberry Perl, which openssl-src takes through OPENSSL_SRC_PERL
    # (as scripts/build-rust-cli.sh does for release builds).
    - name: Use Strawberry Perl for the vendored OpenSSL
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${OPENSSL_SRC_PERL:-}" ]; then
          exit 0
        fi
        strawberry="C:/Strawberry/perl/bin/perl.exe"
        if [ -x "$strawberry" ]; then
          echo "OPENSSL_SRC_PERL=$strawberry" >> "$GITHUB_ENV"
        else
          echo "::warning::no Strawberry Perl at $strawberry; set OPENSSL_SRC_PERL if OpenSSL's Configure fails"
        fi

    # The key covers the compiler, Cargo.lock, every Cargo.toml, and
    # rust-toolchain.toml, so a toolchain or dependency change starts fresh.
    - name: Restore the Cargo cache
      if: inputs.cache-key != ''
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
