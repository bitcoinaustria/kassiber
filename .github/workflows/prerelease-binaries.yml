name: prerelease-binaries

on:
  pull_request:
    paths:
      - ".github/workflows/prerelease-binaries.yml"
      - ".github/workflows/finalize-signed-release.yml"
      - "pyproject.toml"
      # Embedded into the Rust binary with include_str!.
      - "crates/ai/skill_references/**"
      - "kassiber/data/**"
      - "scripts/build-rust-cli.sh"
      - "scripts/check-linux-glibc-floor.sh"
      - "scripts/smoke-packaged-cli.sh"
      - "scripts/package-cli-archive.sh"
      - "tests/test_packaged_cli_no_egress.py"
      - "ui-tauri/provider-broker/**"
      - "scripts/build-apt-repository.sh"
      - "scripts/build-rpm-repository.sh"
      - "scripts/package-cli-deb.sh"
      - "scripts/package-cli-rpm.sh"
      - "scripts/package-desktop-rpm.sh"
      - "scripts/release_manifest.py"
      - "scripts/render_aur.py"
      - "scripts/render_nix.py"
      - "scripts/write_build_info.py"
      - "tax-engine/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/**"
      - "packaging/linux/**"
      - "packaging/release/**"
      - "ui-tauri/package.json"
      - "ui-tauri/pnpm-lock.yaml"
      - "ui-tauri/src-tauri/build.rs"
      - "ui-tauri/src-tauri/Cargo.lock"
      - "ui-tauri/src-tauri/Cargo.toml"
      - "ui-tauri/src-tauri/Info.plist"
      - "ui-tauri/src-tauri/bin/**"
      - "ui-tauri/src-tauri/icons/**"
      - "ui-tauri/src-tauri/src/lib.rs"
      - "ui-tauri/src-tauri/src/main.rs"
      - "ui-tauri/src-tauri/src/supervisor.rs"
      - "ui-tauri/src-tauri/tauri.conf.json"
      - "ui-tauri/src-tauri/windows/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach artifacts to a GitHub release"
        required: true
        default: false
        type: boolean
      release_channel:
        description: "Publish as a prerelease or stable release"
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - release
      tag_name:
        description: "Existing tag to publish to when publish_release is true"
        required: false
        default: ""
        type: string
      draft_release:
        description: "Release builds always remain drafts until platform and manifest-signature verification"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  BUILD_CHANNEL: ${{ github.event_name == 'pull_request' && 'dev' || (github.event_name == 'workflow_dispatch' && inputs.release_channel || 'prerelease') }}
  HOMEBREW_TAP_REPOSITORY: bitcoinaustria/homebrew-kassiber
  HOMEBREW_TAP_BRANCH: main
  HOMEBREW_CASK_PATH: Casks/kassiber.rb
  HOMEBREW_FORMULA_PATH: Formula/kassiber-cli.rb

concurrency:
  group: prerelease-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-cli:
    name: Build ${{ matrix.label }} CLI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The CLI and the desktop sidecar are the Rust `kassiber` binary (plan 21,
    # stage 7). Python only runs the release helper scripts and the smoke's
    # JSON assertions; nothing Python ships. See docs/reference/rust-packaging.md.
    env:
      UV_PYTHON: "3.11"
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            target: macos-arm64
            triple: aarch64-apple-darwin
            exe_ext: ""
            archive: tar
          # Ubuntu 22.04 is the glibc 2.35 floor the AppImage, deb and rpm
          # declare; scripts/build-rust-cli.sh refuses a binary above it.
          - label: Linux x86_64
            os: ubuntu-22.04
            target: linux-x64
            triple: x86_64-unknown-linux-gnu
            exe_ext: ""
            archive: tar
          - label: Windows x86_64
            os: windows-latest
            target: windows-x64
            triple: x86_64-pc-windows-msvc
            exe_ext: ".exe"
            archive: zip

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true

      # Runs the build-identity writer and the smoke's JSON assertions. No
      # runner-provided interpreter is on PATH under every OS in this matrix.
      - name: Install the managed Python
        shell: bash
        run: |
          set -euo pipefail
          uv python install "$UV_PYTHON"
          echo "PYTHON=$(uv python find "$UV_PYTHON")" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # The AI provider broker is a Node script bundled from
      # ui-tauri/provider-broker. It is deliberately NOT committed. The Rust
      # binary looks for it at <executable dir>/provider_broker/index.mjs, so
      # every artifact ships it beside the executable — otherwise the packaged
      # CLI silently loses every CLI-backed AI provider.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0

      - name: Build AI provider broker bundle
        run: |
          pnpm --dir ui-tauri install --frozen-lockfile
          pnpm --dir ui-tauri run broker:build

      - name: Verify broker bundle exists
        shell: bash
        run: |
          set -euo pipefail
          test -s ui-tauri/provider-broker/dist/index.mjs
          echo "broker bundle: $(wc -c < ui-tauri/provider-broker/dist/index.mjs) bytes"

      - name: Install Linux RPM tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio rpm

      - name: Write packaged build identity
        shell: bash
        env:
          DISPATCH_TAG_NAME: ${{ inputs.tag_name }}
          DISPATCH_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          # The backend crate carries the product version. Every other copy
          # must agree (tests/test_dependency_drift.py checks the same set in
          # CI, but needs the Python package this job no longer builds).
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' crates/kassiber/Cargo.toml | head -n 1)"
          "$PYTHON" - "$version" <<'PY'
          import json, re, sys
          from pathlib import Path
          expected = sys.argv[1]
          def table_version(path):
              return re.search(r'(?m)^version\s*=\s*"([^"]+)"', Path(path).read_text(encoding="utf-8")).group(1)
          found = {
              "pyproject.toml": table_version("pyproject.toml"),
              "ui-tauri/src-tauri/Cargo.toml": table_version("ui-tauri/src-tauri/Cargo.toml"),
              "ui-tauri/package.json": json.loads(Path("ui-tauri/package.json").read_text(encoding="utf-8"))["version"],
              "ui-tauri/src-tauri/tauri.conf.json": json.loads(Path("ui-tauri/src-tauri/tauri.conf.json").read_text(encoding="utf-8"))["version"],
          }
          wrong = {path: value for path, value in found.items() if value != expected}
          if not expected or wrong:
              sys.exit(f"crates/kassiber is {expected!r}, but these disagree: {wrong}")
          PY
          release_tag=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
              && [ "$DISPATCH_PUBLISH_RELEASE" = "true" ]; then
            release_tag="$DISPATCH_TAG_NAME"
          fi
          if [ -n "$release_tag" ]; then
            case "$release_tag" in
              v*) expected_version="${release_tag#v}" ;;
              *)
                echo "Release tag must start with v: $release_tag" >&2
                exit 1
                ;;
            esac
            if [ "$version" != "$expected_version" ]; then
              echo "Release tag $release_tag does not match package version $version." >&2
              exit 1
            fi
          fi
          package_commit="$(git rev-parse HEAD)"
          package_ref="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_TAG_NAME" ]; then
            package_ref="$DISPATCH_TAG_NAME"
          fi
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          "$PYTHON" scripts/write_build_info.py \
            --output build/BUILD_INFO.json \
            --version "$version" \
            --commit "$package_commit" \
            --ref "$package_ref" \
            --run-id "$GITHUB_RUN_ID" \
            --channel "$BUILD_CHANNEL"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "PACKAGE_COMMIT=$package_commit" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

      # One executable serves the downloadable CLI and the desktop sidecar, on
      # every platform: no one-file extraction, no one-dir payload.
      - name: Build the Rust kassiber binary
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-rust-cli.sh \
            --target "${{ matrix.triple }}" \
            --channel "$BUILD_CHANNEL" \
            --commit "$PACKAGE_COMMIT" \
            --output dist

      - name: Smoke packaged CLI
        shell: bash
        run: |
          set -euo pipefail
          smoke_args=(
            --cli "./dist/kassiber${{ matrix.exe_ext }}"
            --scratch "$RUNNER_TEMP/kassiber-packaged-smoke"
            --expect-commit "$(git rev-parse --short=12 HEAD)"
          )
          # Hosted Linux runners have no live logind user session, so Linux
          # smokes the descriptor-passphrase path; see the script.
          if [ "$RUNNER_OS" != "Linux" ]; then
            smoke_args+=(--operator-unlock)
          fi
          scripts/smoke-packaged-cli.sh "${smoke_args[@]}"

      - name: Prove the packaged CLI stays offline
        if: runner.os == 'Linux'
        shell: bash
        env:
          KASSIBER_PACKAGED_CLI: dist/kassiber
        run: |
          set -euo pipefail
          "$PYTHON" -m unittest -v tests.test_packaged_cli_no_egress

      - name: Package CLI-only release
        shell: bash
        run: |
          set -euo pipefail
          package_name="kassiber-cli-${{ matrix.target }}"
          broker=ui-tauri/provider-broker/dist/index.mjs
          scripts/package-cli-archive.sh \
            --binary "dist/kassiber${{ matrix.exe_ext }}" \
            --broker "$broker" \
            --build-info build/BUILD_INFO.json \
            --name "$package_name" \
            --format "${{ matrix.archive }}" \
            --output-dir release
          if [ "$RUNNER_OS" = "Linux" ]; then
            scripts/package-cli-deb.sh \
              --binary "dist/kassiber${{ matrix.exe_ext }}" \
              --broker "$broker" \
              --version "$PACKAGE_VERSION" \
              --output "release/${package_name}.deb"
            scripts/package-cli-rpm.sh \
              --binary "dist/kassiber${{ matrix.exe_ext }}" \
              --broker "$broker" \
              --version "$PACKAGE_VERSION" \
              --architecture x86_64 \
              --output "release/${package_name}.rpm"
            rpm_path="$PWD/release/${package_name}.rpm"
            rpm_root="$(mktemp -d)"
            (cd "$rpm_root" && rpm2cpio "$rpm_path" | cpio --quiet -id)
            test -s "$rpm_root/usr/lib/kassiber-cli/provider_broker/index.mjs"
            "$rpm_root/usr/bin/kassiber" --version \
              | grep "$(git rev-parse --short=12 HEAD)"
          fi

      - name: Upload CLI-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kassiber-cli-release-${{ matrix.target }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.deb
            release/*.rpm
          if-no-files-found: error

      # The sidecar is the same executable under its target-triple name, with
      # the broker and the build record beside it. macOS keeps the `kassiber-cli/` directory the
      # Touch ID helper's identity check and the bundle launcher expect; the
      # others stage flat. Both layouts are what `bundled_sidecar` in
      # ui-tauri/src-tauri/src/supervisor.rs looks for.
      - name: Stage desktop sidecar
        shell: bash
        run: |
          set -euo pipefail
          sidecar_dir=sidecar
          if [ "$RUNNER_OS" = "macOS" ]; then
            sidecar_dir=sidecar/kassiber-cli
          fi
          mkdir -p "$sidecar_dir/provider_broker"
          cp "dist/kassiber${{ matrix.exe_ext }}" \
            "$sidecar_dir/kassiber-cli-${{ matrix.triple }}${{ matrix.exe_ext }}"
          chmod 755 "$sidecar_dir/kassiber-cli-${{ matrix.triple }}${{ matrix.exe_ext }}"
          cp ui-tauri/provider-broker/dist/index.mjs "$sidecar_dir/provider_broker/index.mjs"
          # The macOS signer requires embedded build provenance in the app;
          # the Python sidecar carried it inside its payload.
          cp build/BUILD_INFO.json "$sidecar_dir/BUILD_INFO.json"

      # `path: sidecar` (the directory), not `sidecar/*`: with a glob the
      # artifact root collapses to the single matched entry, which would drop
      # the `kassiber-cli/` level on macOS.
      - name: Upload desktop sidecar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kassiber-desktop-sidecar-${{ matrix.triple }}
          path: sidecar
          if-no-files-found: error
          retention-days: 7

  build-desktop:
    name: Build ${{ matrix.label }} desktop preview
    needs:
      - build-cli
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            target: macos-arm64
            bundles: app,dmg
            tauri_args: --target aarch64-apple-darwin
            sidecar_artifact_pattern: kassiber-desktop-sidecar-aarch64-apple-darwin
            sidecar_expected: 1
          - label: Linux
            os: ubuntu-22.04
            target: linux-x64
            bundles: deb,appimage
            tauri_args: ""
            sidecar_artifact_pattern: kassiber-desktop-sidecar-x86_64-unknown-linux-gnu
            sidecar_expected: 1
          - label: Windows
            os: windows-latest
            target: windows-x64
            bundles: msi,nsis
            tauri_args: ""
            sidecar_artifact_pattern: kassiber-desktop-sidecar-x86_64-pc-windows-msvc
            sidecar_expected: 1

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cpio \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - name: Install frontend dependencies
        working-directory: ui-tauri
        run: pnpm install --frozen-lockfile

      - name: Download desktop CLI sidecar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ${{ matrix.sidecar_artifact_pattern }}
          path: ui-tauri/src-tauri/binaries
          merge-multiple: true

      # upload-artifact does not preserve the executable bit, so restore it
      # before Tauri copies the sidecar into the bundle. macOS looks one level
      # deeper: its sidecar lands under `binaries/kassiber-cli/`.
      - name: Verify desktop CLI sidecar inputs
        shell: bash
        run: |
          set -euo pipefail
          root=ui-tauri/src-tauri/binaries
          if [ "$RUNNER_OS" = "macOS" ]; then
            root=$root/kassiber-cli
          fi
          # A leftover one-dir payload (the retired Python sidecar) must never ride along.
          test ! -e "$root/_internal"
          test -s "$root/provider_broker/index.mjs"
          test -s "$root/BUILD_INFO.json"
          count="$(find "$root" -maxdepth 1 -type f -name 'kassiber-cli-*' | wc -l | tr -d ' ')"
          test "$count" = "${{ matrix.sidecar_expected }}"
          find "$root" -maxdepth 1 -type f -name 'kassiber-cli-*' -exec chmod 755 {} +
          find "$root" -maxdepth 1 -type f -name 'kassiber-cli-*' -print
          if [ "$RUNNER_OS" = "Windows" ]; then
            sidecar="$(find "$root" -maxdepth 1 -type f -name 'kassiber-cli-*.exe' -print -quit)"
            test -n "$sidecar"
            # The PATH entry runs this copy directly, so the broker it looks
            # for beside its own executable has to be there too.
            cp "$sidecar" ui-tauri/src-tauri/bin/kassiber.exe
            mkdir -p ui-tauri/src-tauri/bin/provider_broker
            cp "$root/provider_broker/index.mjs" ui-tauri/src-tauri/bin/provider_broker/index.mjs
          fi

      - name: Build unsigned desktop preview
        working-directory: ui-tauri
        run: pnpm tauri build ${{ matrix.tauri_args }} --bundles ${{ matrix.bundles }} --ci

      - name: Use the host Wayland client in the AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t appdirs < <(
            find ui-tauri/src-tauri/target -path '*/release/bundle/appimage/*.AppDir' -type d -print0
          )
          mapfile -d '' -t appimages < <(
            find ui-tauri/src-tauri/target -path '*/release/bundle/appimage/*.AppImage' -type f -print0
          )
          test "${#appdirs[@]}" -eq 1
          test "${#appimages[@]}" -eq 1

          appdir="$(realpath "${appdirs[0]}")"
          appimage="$(realpath "${appimages[0]}")"
          wayland_client="$appdir/usr/lib/libwayland-client.so.0"
          plugin="$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage"
          test -f "$wayland_client"
          test -x "$plugin"

          rm "$wayland_client"
          APPIMAGE_EXTRACT_AND_RUN=1 LDAI_OUTPUT="$appimage" ARCH=x86_64 \
            "$plugin" --appimage-extract-and-run --appdir="$appdir"

          inspection="$(mktemp -d)"
          trap 'rm -rf "$inspection"' EXIT
          (
            cd "$inspection"
            "$appimage" --appimage-extract 'usr/lib/libwayland-client.so*' >/dev/null
          )
          test -z "$(find "$inspection" -name 'libwayland-client.so*' -print -quit)"
          mapfile -d '' -t sealed_appimages < <(
            find "$(dirname "$appimage")" -maxdepth 1 -type f -name '*.AppImage' -print0
          )
          test "${#sealed_appimages[@]}" -eq 1

      - name: Smoke desktop terminal forwarding
        shell: bash
        run: |
          set -euo pipefail
          expected_commit="$(git rev-parse --short=12 HEAD)"
          case "$RUNNER_OS" in
            macOS)
              launcher="$(find ui-tauri/src-tauri/target -path '*/release/bundle/macos/*.app/Contents/Resources/bin/kassiber' -print -quit)"
              test -n "$launcher"
              "$launcher" --version | grep "$expected_commit"
              "$launcher" --help >/dev/null
              resources="$(dirname "$(dirname "$launcher")")"
              test -s "$resources/binaries/kassiber-cli/provider_broker/index.mjs"
              test ! -e "$resources/binaries/kassiber-cli/_internal"
              ;;
            Linux)
              appimage="$(find ui-tauri/src-tauri/target -path '*/release/bundle/appimage/*.AppImage' -print -quit)"
              test -n "$appimage"
              chmod 755 "$appimage"
              APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --cli --version \
                | grep "$expected_commit"
              # The shell and the sidecar inside both installers must load on
              # the glibc floor, and the sidecar must find its broker.
              deb="$(find ui-tauri/src-tauri/target -path '*/release/bundle/deb/*.deb' -print -quit)"
              test -n "$deb"
              payload="$(mktemp -d)"
              dpkg-deb -x "$deb" "$payload"
              scripts/check-linux-glibc-floor.sh --any-libraries "$payload/usr/bin/kassiber-ui"
              scripts/check-linux-glibc-floor.sh \
                "$payload/usr/lib/Kassiber/binaries/kassiber-cli-x86_64-unknown-linux-gnu"
              test -s "$payload/usr/lib/Kassiber/binaries/provider_broker/index.mjs"
              inspection="$(mktemp -d)"
              (
                cd "$inspection"
                "$OLDPWD/$appimage" --appimage-extract 'usr/lib/Kassiber/binaries/*' >/dev/null
              )
              test -s "$inspection/squashfs-root/usr/lib/Kassiber/binaries/provider_broker/index.mjs"
              scripts/check-linux-glibc-floor.sh \
                "$inspection/squashfs-root/usr/lib/Kassiber/binaries/kassiber-cli-x86_64-unknown-linux-gnu"
              ;;
            Windows)
              # The PATH entry exposes a native executable so arguments are
              # never reparsed by cmd.exe.
              ./ui-tauri/src-tauri/bin/kassiber.exe --version \
                | grep "$expected_commit"
              ;;
          esac

      - name: Package desktop artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release
          while IFS= read -r -d '' artifact; do
              name="$(basename "$artifact")"
              case "$artifact" in
                *.app)
                  zip_name="kassiber-${{ matrix.target }}.app.zip"
                  ditto -c -k --keepParent "$artifact" "release/${zip_name}"
                  ;;
                *.AppImage)
                  artifact_name="kassiber-${{ matrix.target }}.AppImage"
                  cp "$artifact" "release/${artifact_name}"
                  ;;
                *.dmg)
                  artifact_name="kassiber-${{ matrix.target }}.dmg"
                  cp "$artifact" "release/${artifact_name}"
                  ;;
                *.deb)
                  artifact_name="kassiber-${{ matrix.target }}.deb"
                  cp "$artifact" "release/${artifact_name}"
                  ;;
                *.exe)
                  artifact_name="kassiber-${{ matrix.target }}.exe"
                  cp "$artifact" "release/${artifact_name}"
                  ;;
                *.msi)
                  artifact_name="kassiber-${{ matrix.target }}.msi"
                  cp "$artifact" "release/${artifact_name}"
                  ;;
              esac
          done < <(
          find ui-tauri/src-tauri/target \
              -path "*/release/bundle/*" \
              \( -name "*.AppImage" -o -name "*.app" -o -name "*.deb" -o -name "*.dmg" -o -name "*.exe" -o -name "*.msi" \) -print0
          )
          if [ "$RUNNER_OS" = "Linux" ]; then
            desktop_deb="$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)"
            test -n "$desktop_deb"
            package_version="$(python3 -c 'import json; print(json.load(open("ui-tauri/src-tauri/tauri.conf.json", encoding="utf-8"))["version"])')"
            export SOURCE_DATE_EPOCH
            SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
            scripts/package-desktop-rpm.sh \
              --deb "$desktop_deb" \
              --version "$package_version" \
              --architecture x86_64 \
              --output "release/kassiber-${{ matrix.target }}.rpm"
            rpm_path="$PWD/release/kassiber-${{ matrix.target }}.rpm"
            rpm_root="$(mktemp -d)"
            (cd "$rpm_root" && rpm2cpio "$rpm_path" | cpio --quiet -id)
            rpm_sidecar="$(find "$rpm_root/usr/lib/Kassiber" \
              -type f -name 'kassiber-cli*' -print -quit)"
            test -x "$rpm_sidecar"
            "$rpm_sidecar" --version \
              | grep "$(git rev-parse --short=12 HEAD)"
          fi
          test -n "$(find release -type f -print -quit)"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kassiber-desktop-${{ matrix.target }}-preview
          path: |
            release/*
          if-no-files-found: error

  publish:
    name: Publish release artifacts
    permissions:
      contents: write
    needs:
      - build-cli
      - build-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.publish_release == true &&
      inputs.tag_name != '')

    steps:
      - name: Check out Kassiber source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Require the release tag to come from trusted main history
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag must point to a commit in origin/main history." >&2
            exit 1
          fi

      - name: Enforce release signing cutover policy
        id: release-signing
        env:
          RELEASE_IS_DRAFT: 'true'
        run: |
          set -euo pipefail
          policy_json="$(python3 scripts/release_manifest.py policy \
            --policy packaging/release/signing-policy.json)"
          policy_enabled="$(python3 -c 'import json,sys; print(str(json.loads(sys.argv[1])["enabled"]).lower())' "$policy_json")"
          if [ "$policy_enabled" = true ] && [ "$RELEASE_IS_DRAFT" != true ]; then
            echo "Signed-release policy is enabled; build a draft and publish it only through finalize-signed-release.yml." >&2
            exit 1
          fi
          echo "enabled=$policy_enabled" >> "$GITHUB_OUTPUT"

      - name: Download CLI release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: kassiber-cli-release-*
          path: release
          merge-multiple: true

      - name: Download desktop release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: kassiber-desktop-*-preview
          path: release
          merge-multiple: true

      - name: Verify release artifact set
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release -maxdepth 1 -type f -print -quit)"

          if find release -maxdepth 1 -type f -name 'kassiber-cli-*' ! -name '*.tar.gz' ! -name '*.zip' ! -name '*.deb' ! -name '*.rpm' -print -quit | grep -q .; then
            echo "Raw CLI sidecars must not be published as release assets." >&2
            find release -maxdepth 1 -type f -name 'kassiber-cli-*' ! -name '*.tar.gz' ! -name '*.zip' ! -name '*.deb' ! -name '*.rpm' >&2
            exit 1
          fi

      - name: Generate release manifest
        id: release-manifest
        shell: bash
        env:
          RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG_NAME#v}"
          python scripts/release_manifest.py generate \
            --release-dir release \
            --version "$version"
          manifest_path="release/kassiber-${version}-manifest.txt"
          test -s "$manifest_path"
          echo "path=${manifest_path}" >> "$GITHUB_OUTPUT"

      - name: Never replace an already published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          # A missing release is allowed; API/auth failures are not.
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | [.tag_name, .draft] | @tsv')"
          state="$(printf '%s\n' "$releases" | awk -F '\t' -v tag="$TAG" '$1 == tag {print $2}')"
          test -z "$state" || test "$state" = true
          if [ "$state" = true ]; then
            echo 'Draft already exists; use a new tag/build rather than overwriting a signing handoff.' >&2
            exit 1
          fi
      - name: Extract reviewed release notes
        env:
          RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: python scripts/release_notes.py --version "$RELEASE_TAG_NAME" --output "$RUNNER_TEMP/release-notes.md"
      - name: Create or update release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.release_channel == 'prerelease' }}
          draft: true
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            release/*

      - name: Check Homebrew tap publishing
        id: homebrew-tap
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_IS_DRAFT: 'true'
          RELEASE_SIGNING_ENABLED: ${{ steps.release-signing.outputs.enabled }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_SIGNING_ENABLED" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signed release metadata is published only after the finalizer verifies the manifest signature."
          elif [ "$RELEASE_IS_DRAFT" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release is a draft pending release-manifest signing; skipping Homebrew update."
          elif [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew cask update."
          fi

      - name: Check out Homebrew tap
        if: steps.homebrew-tap.outputs.enabled == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ env.HOMEBREW_TAP_REPOSITORY }}
          ref: ${{ env.HOMEBREW_TAP_BRANCH }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render Homebrew cask and CLI formula
        if: steps.homebrew-tap.outputs.enabled == 'true'
        shell: bash
        env:
          RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          RELEASE_MANIFEST_PATH: ${{ steps.release-manifest.outputs.path }}
        run: |
          set -euo pipefail
          tag_name="${RELEASE_TAG_NAME}"
          version="${tag_name#v}"

          release_sha256() {
            local name="$1"
            local sha256
            test -f "release/${name}"
            sha256="$(awk -v name="$name" '$2 == name { print $1 }' "$RELEASE_MANIFEST_PATH")"
            test -n "$sha256"
            printf '%s' "$sha256"
          }

          python scripts/render_homebrew.py cask \
            --version "$version" \
            --sha256 "$(release_sha256 kassiber-macos-arm64.dmg)" \
            --output "homebrew-tap/${HOMEBREW_CASK_PATH}"

          python scripts/render_homebrew.py cli-formula \
            --version "$version" \
            --sha256-macos-arm64 "$(release_sha256 kassiber-cli-macos-arm64.tar.gz)" \
            --sha256-linux-x64 "$(release_sha256 kassiber-cli-linux-x64.tar.gz)" \
            --output "homebrew-tap/${HOMEBREW_FORMULA_PATH}"

      - name: Commit Homebrew tap update
        if: steps.homebrew-tap.outputs.enabled == 'true'
        shell: bash
        working-directory: homebrew-tap
        env:
          RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          tag_name="${RELEASE_TAG_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HOMEBREW_CASK_PATH" "$HOMEBREW_FORMULA_PATH"

          if git diff --cached --quiet; then
            echo "Homebrew tap already matches ${tag_name}; nothing to push."
            exit 0
          fi

          git commit -m "Update Kassiber cask and CLI formula to ${tag_name}"
          git push origin "HEAD:${HOMEBREW_TAP_BRANCH}"
