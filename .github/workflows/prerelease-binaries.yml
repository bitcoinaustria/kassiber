name: prerelease-binaries

on:
  # Pull requests run only on request: adding the `ci` label (see the note in
  # ci.yml and docs/reference/testing.md#pull-request-ci).
  pull_request:
    types: [labeled]
    paths:
      - ".github/workflows/prerelease-binaries.yml"
      - ".github/workflows/finalize-signed-release.yml"
      # Embedded into the Rust binary with include_str!.
      - "crates/ai/skill_references/**"
      - "kassiber/data/**"
      - "scripts/build-rust-cli.sh"
      - "scripts/check-linux-glibc-floor.sh"
      - "scripts/smoke-packaged-cli.sh"
      - "scripts/package-cli-archive.sh"
      - "scripts/check-packaged-cli-no-egress.sh"
      - "scripts/build-apt-repository.sh"
      - "scripts/build-rpm-repository.sh"
      - "scripts/package-cli-deb.sh"
      - "scripts/package-cli-rpm.sh"
      - "scripts/package-desktop-rpm.sh"
      - "tax-engine/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/**"
      - ".github/actions/release-tool/**"
      - "packaging/linux/**"
      - "packaging/release/**"
      # The desktop app (crates/kassiber-desktop) is covered by "crates/**";
      # its packaging lives in crates/kassiber-desktop/packaging/.
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach artifacts to a GitHub release"
        required: true
        default: false
        type: boolean
      release_channel:
        description: "Publish as a prerelease or stable release"
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - release
      tag_name:
        description: "Existing tag to publish to when publish_release is true"
        required: false
        default: ""
        type: string
      draft_release:
        description: "Release builds always remain drafts until platform and manifest-signature verification"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  BUILD_CHANNEL: ${{ github.event_name == 'pull_request' && 'dev' || (github.event_name == 'workflow_dispatch' && inputs.release_channel || 'prerelease') }}
  HOMEBREW_TAP_REPOSITORY: bitcoinaustria/homebrew-kassiber
  HOMEBREW_TAP_BRANCH: main
  HOMEBREW_CASK_PATH: Casks/kassiber.rb
  HOMEBREW_FORMULA_PATH: Formula/kassiber-cli.rb

concurrency:
  # Another label's run does nothing; it must not displace a requested run.
  group: prerelease-binaries-${{ (github.event_name == 'pull_request' && github.event.label.name != 'ci' && format('other-label-{0}', github.run_id)) || github.ref }}
  cancel-in-progress: false

jobs:
  build-cli:
    name: Build ${{ matrix.label }} CLI
    # Stacked pull requests (based on another pull request's branch) skip the
    # package builds; they run once the layer targets main (ci.yml lane note).
    if: github.event_name != 'pull_request' || (github.event.label.name == 'ci' && github.base_ref == 'main')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The CLI and the desktop sidecar are the Rust `kassiber` binary (plan 21,
    # stage 7); the job needs no Python. See docs/reference/rust-packaging.md.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            target: macos-arm64
            triple: aarch64-apple-darwin
            exe_ext: ""
            archive: tar
          # Ubuntu 22.04 is the glibc 2.35 floor the AppImage, deb and rpm
          # declare; scripts/build-rust-cli.sh refuses a binary above it.
          - label: Linux x86_64
            os: ubuntu-22.04
            target: linux-x64
            triple: x86_64-unknown-linux-gnu
            exe_ext: ""
            archive: tar
          - label: Windows x86_64
            os: windows-latest
            target: windows-x64
            triple: x86_64-pc-windows-msvc
            exe_ext: ".exe"
            archive: zip

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Build the release tool
        uses: ./.github/actions/release-tool
        with:
          setup-rust: "false"

      - name: Install Linux RPM tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio rpm

      - name: Write packaged build identity
        shell: bash
        env:
          DISPATCH_TAG_NAME: ${{ inputs.tag_name }}
          DISPATCH_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          # The backend crate carries the product version; the desktop
          # packaging scripts stamp it into the app bundles and installers.
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' crates/kassiber/Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "crates/kassiber/Cargo.toml has no package version" >&2
            exit 1
          fi
          release_tag=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
              && [ "$DISPATCH_PUBLISH_RELEASE" = "true" ]; then
            release_tag="$DISPATCH_TAG_NAME"
          fi
          if [ -n "$release_tag" ]; then
            case "$release_tag" in
              v*) expected_version="${release_tag#v}" ;;
              *)
                echo "Release tag must start with v: $release_tag" >&2
                exit 1
                ;;
            esac
            if [ "$version" != "$expected_version" ]; then
              echo "Release tag $release_tag does not match package version $version." >&2
              exit 1
            fi
          fi
          package_commit="$(git rev-parse HEAD)"
          package_ref="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_TAG_NAME" ]; then
            package_ref="$DISPATCH_TAG_NAME"
          fi
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          "$KASSIBER_RELEASE_TOOL" build-info \
            --output build/BUILD_INFO.json \
            --version "$version" \
            --commit "$package_commit" \
            --ref "$package_ref" \
            --run-id "$GITHUB_RUN_ID" \
            --channel "$BUILD_CHANNEL"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "PACKAGE_COMMIT=$package_commit" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

      # One executable serves the downloadable CLI and the desktop sidecar, on
      # every platform: no one-file extraction, no one-dir payload.
      - name: Build the Rust kassiber binary
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-rust-cli.sh \
            --target "${{ matrix.triple }}" \
            --channel "$BUILD_CHANNEL" \
            --commit "$PACKAGE_COMMIT" \
            --output dist

      - name: Smoke packaged CLI
        shell: bash
        run: |
          set -euo pipefail
          smoke_args=(
            --cli "./dist/kassiber${{ matrix.exe_ext }}"
            --scratch "$RUNNER_TEMP/kassiber-packaged-smoke"
            --expect-commit "$(git rev-parse --short=12 HEAD)"
          )
          # Hosted Linux runners have no live logind user session, so Linux
          # smokes the descriptor-passphrase path; see the script.
          if [ "$RUNNER_OS" != "Linux" ]; then
            smoke_args+=(--operator-unlock)
          fi
          scripts/smoke-packaged-cli.sh "${smoke_args[@]}"

      - name: Prove the packaged CLI stays offline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          scripts/check-packaged-cli-no-egress.sh \
            --cli dist/kassiber \
            --scratch "$RUNNER_TEMP/kassiber-packaged-no-egress"

      - name: Package CLI-only release
        shell: bash
        run: |
          set -euo pipefail
          package_name="kassiber-cli-${{ matrix.target }}"
          scripts/package-cli-archive.sh \
            --binary "dist/kassiber${{ matrix.exe_ext }}" \
            --build-info build/BUILD_INFO.json \
            --name "$package_name" \
            --format "${{ matrix.archive }}" \
            --output-dir release
          if [ "$RUNNER_OS" = "Linux" ]; then
            scripts/package-cli-deb.sh \
              --binary "dist/kassiber${{ matrix.exe_ext }}" \
              --version "$PACKAGE_VERSION" \
              --output "release/${package_name}.deb"
            scripts/package-cli-rpm.sh \
              --binary "dist/kassiber${{ matrix.exe_ext }}" \
              --version "$PACKAGE_VERSION" \
              --architecture x86_64 \
              --output "release/${package_name}.rpm"
            rpm_path="$PWD/release/${package_name}.rpm"
            rpm_root="$(mktemp -d)"
            (cd "$rpm_root" && rpm2cpio "$rpm_path" | cpio --quiet -id)
            "$rpm_root/usr/bin/kassiber" --version \
              | grep "$(git rev-parse --short=12 HEAD)"
          fi

      - name: Upload CLI-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kassiber-cli-release-${{ matrix.target }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.deb
            release/*.rpm
          if-no-files-found: error

      # The sidecar is the same executable under its target-triple name, with
      # the build record beside it. macOS keeps the `kassiber-cli/` directory the
      # Touch ID helper's identity check and the bundle launcher expect; the
      # others stage flat. The desktop packaging scripts place the binary
      # where `bundled_sidecar` in crates/kassiber-desktop/src/daemon.rs looks.
      - name: Stage desktop sidecar
        shell: bash
        run: |
          set -euo pipefail
          sidecar_dir=sidecar
          if [ "$RUNNER_OS" = "macOS" ]; then
            sidecar_dir=sidecar/kassiber-cli
          fi
          mkdir -p "$sidecar_dir"
          cp "dist/kassiber${{ matrix.exe_ext }}" \
            "$sidecar_dir/kassiber-cli-${{ matrix.triple }}${{ matrix.exe_ext }}"
          chmod 755 "$sidecar_dir/kassiber-cli-${{ matrix.triple }}${{ matrix.exe_ext }}"
          # The macOS signer requires embedded build provenance in the app;
          # the Python sidecar carried it inside its payload.
          cp build/BUILD_INFO.json "$sidecar_dir/BUILD_INFO.json"

      # `path: sidecar` (the directory), not `sidecar/*`: with a glob the
      # artifact root collapses to the single matched entry, which would drop
      # the `kassiber-cli/` level on macOS.
      - name: Upload desktop sidecar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kassiber-desktop-sidecar-${{ matrix.triple }}
          path: sidecar
          if-no-files-found: error
          retention-days: 7

  # The desktop is the Rune app (crates/kassiber-desktop, its own Cargo
  # workspace), packaged around the sidecar the build-cli job built and smoked.
  # The packaging scripts under crates/kassiber-desktop/packaging/ assemble the
  # same layouts and artifact names the earlier desktop bundles had, so the
  # signing, notarization, Homebrew and Linux channel steps take them unchanged.
  build-desktop:
    name: Build ${{ matrix.label }} desktop preview
    needs:
      - build-cli
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            target: macos-arm64
            triple: aarch64-apple-darwin
            exe_ext: ""
          # Ubuntu 22.04 is the glibc 2.35 floor the deb, rpm and AppImage
          # declare; build-packages.sh checks both binaries against it.
          - label: Linux
            os: ubuntu-22.04
            target: linux-x64
            triple: x86_64-unknown-linux-gnu
            exe_ext: ""
          # windows-2025 (windows-latest) has WiX v3 but no NSIS; the 2022
          # image has both.
          - label: Windows
            os: windows-2022
            target: windows-x64
            triple: x86_64-pc-windows-msvc
            exe_ext: ".exe"
    env:
      # appimagetool would otherwise download the latest AppImage runtime at
      # build time; both are pinned by digest (GitHub's release asset digests).
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # Rune's Linux build links fontconfig and compiles wayland-backend's C
      # shim (as in ci.yml's desktop job); rpm and cpio repack the deb.
      - name: Install Linux build and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cpio \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            rpm

      - name: Install the pinned AppImage tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/appimage"
          mkdir -p "$tools/bin"
          curl -fsSL --retry 3 -o "$tools/bin/appimagetool" "$APPIMAGETOOL_URL"
          curl -fsSL --retry 3 -o "$tools/runtime-x86_64" "$APPIMAGE_RUNTIME_URL"
          printf '%s  %s\n' \
            "$APPIMAGETOOL_SHA256" "$tools/bin/appimagetool" \
            "$APPIMAGE_RUNTIME_SHA256" "$tools/runtime-x86_64" | sha256sum -c -
          chmod 755 "$tools/bin/appimagetool"
          echo "$tools/bin" >> "$GITHUB_PATH"
          # Hosted runners have no FUSE for the tool's own AppImage.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$tools/runtime-x86_64" >> "$GITHUB_ENV"

      - name: Put WiX and NSIS on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WIX:-}"
          wix_bin="$(cygpath -u "$WIX")/bin"
          nsis="/c/Program Files (x86)/NSIS"
          test -x "$wix_bin/candle.exe"
          test -x "$wix_bin/light.exe"
          test -x "$nsis/makensis.exe"
          cygpath -w "$wix_bin" >> "$GITHUB_PATH"
          cygpath -w "$nsis" >> "$GITHUB_PATH"

      - name: Download desktop CLI sidecar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: kassiber-desktop-sidecar-${{ matrix.triple }}
          path: sidecar
          merge-multiple: true

      # upload-artifact does not preserve the executable bit. macOS looks one
      # level deeper: its sidecar lands under `sidecar/kassiber-cli/`.
      - name: Verify desktop CLI sidecar inputs
        shell: bash
        run: |
          set -euo pipefail
          root=sidecar
          if [ "$RUNNER_OS" = "macOS" ]; then
            root=$root/kassiber-cli
          fi
          # A leftover one-dir payload (the retired Python sidecar) must never ride along.
          test ! -e "$root/_internal"
          test -s "$root/BUILD_INFO.json"
          count="$(find "$root" -maxdepth 1 -type f -name 'kassiber-cli-*' | wc -l | tr -d ' ')"
          test "$count" = 1
          sidecar="$root/kassiber-cli-${{ matrix.triple }}${{ matrix.exe_ext }}"
          test -f "$sidecar"
          chmod 755 "$sidecar"
          "$sidecar" --version | grep "$(git rev-parse --short=12 HEAD)"
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' crates/kassiber/Cargo.toml | head -n 1)"
          test -n "$version"
          {
            echo "SIDECAR=$PWD/$sidecar"
            echo "SIDECAR_BUILD_INFO=$PWD/$root/BUILD_INFO.json"
            echo "PACKAGE_VERSION=$version"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_ENV"

      # Without Rune's agent tooling: the shipped app refuses every headless
      # argument (each packaging script checks).
      - name: Build the desktop app
        shell: bash
        working-directory: crates/kassiber-desktop
        run: |
          set -euo pipefail
          cargo build --release --locked --no-default-features
          echo "RUNE_BIN=$PWD/target/release/kassiber-desktop${{ matrix.exe_ext }}" >> "$GITHUB_ENV"

      - name: Package the macOS app and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/desktop"
          crates/kassiber-desktop/packaging/macos/build-app.sh \
            --kassiber-bin "$SIDECAR" \
            --rune-bin "$RUNE_BIN" \
            --identity release \
            --version "$PACKAGE_VERSION" \
            --build-info "$SIDECAR_BUILD_INFO" \
            --output "$out" \
            --zip
          expected_commit="$(git rev-parse --short=12 HEAD)"
          launcher="$out/Kassiber.app/Contents/Resources/bin/kassiber"
          "$launcher" --version | grep "$expected_commit"
          "$launcher" --help >/dev/null
          test ! -e "$out/Kassiber.app/Contents/Resources/binaries/kassiber-cli/_internal"
          mkdir -p release
          cp "$out/kassiber-macos-arm64.app.zip" release/
          dmg_stage="$(mktemp -d)"
          ditto "$out/Kassiber.app" "$dmg_stage/Kassiber.app"
          ln -s /Applications "$dmg_stage/Applications"
          hdiutil create -quiet -volname Kassiber -srcfolder "$dmg_stage" -ov -format UDZO \
            release/kassiber-macos-arm64.dmg

      - name: Package the Linux deb, AppImage and rpm
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Checks both binaries against the glibc floor before packaging.
          crates/kassiber-desktop/packaging/linux/build-packages.sh \
            --rune-bin "$RUNE_BIN" \
            --kassiber-bin "$SIDECAR" \
            --build-info "$SIDECAR_BUILD_INFO" \
            --version "$PACKAGE_VERSION" \
            --arch amd64 \
            --appimage-runtime "$APPIMAGE_RUNTIME" \
            --output release
          expected_commit="$(git rev-parse --short=12 HEAD)"
          appimage=release/kassiber-linux-x64.AppImage
          chmod 755 "$appimage"
          "$appimage" --cli --version | grep "$expected_commit"
          payload="$(mktemp -d)"
          dpkg-deb -x release/kassiber-linux-x64.deb "$payload"
          "$payload/usr/lib/Kassiber/binaries/kassiber-cli-x86_64-unknown-linux-gnu" --version \
            | grep "$expected_commit"
          scripts/package-desktop-rpm.sh \
            --deb release/kassiber-linux-x64.deb \
            --version "$PACKAGE_VERSION" \
            --architecture x86_64 \
            --output release/kassiber-linux-x64.rpm
          rpm_root="$(mktemp -d)"
          rpm_path="$PWD/release/kassiber-linux-x64.rpm"
          (cd "$rpm_root" && rpm2cpio "$rpm_path" | cpio --quiet -id)
          test -x "$rpm_root/usr/bin/kassiber-ui"
          "$rpm_root/usr/lib/Kassiber/binaries/kassiber-cli-x86_64-unknown-linux-gnu" --version \
            | grep "$expected_commit"
          # Installed, both terminal entry points reach the sidecar: /usr/bin/kassiber
          # forwards through `kassiber-ui --cli`, which must not find the forwarder.
          sudo apt-get install -y --no-install-recommends ./release/kassiber-linux-x64.deb
          timeout 60 kassiber --version | grep "$expected_commit"
          timeout 60 kassiber-ui --cli --version | grep "$expected_commit"
          sudo apt-get remove -y kassiber

      - name: Package the Windows MSI and setup
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          crates/kassiber-desktop/packaging/windows/build-installers.sh \
            --rune-bin "$RUNE_BIN" \
            --kassiber-bin "$SIDECAR" \
            --build-info "$SIDECAR_BUILD_INFO" \
            --version "$PACKAGE_VERSION" \
            --output release
          test -s release/kassiber-windows-x64.msi
          test -s release/kassiber-windows-x64.exe

      - name: Upload desktop artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kassiber-desktop-${{ matrix.target }}-preview
          path: |
            release/*
          if-no-files-found: error

  publish:
    name: Publish release artifacts
    permissions:
      contents: write
    needs:
      - build-cli
      - build-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.publish_release == true &&
      inputs.tag_name != '')

    steps:
      - name: Check out Kassiber source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Require the release tag to come from trusted main history
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag must point to a commit in origin/main history." >&2
            exit 1
          fi

      - name: Build the release tool
        uses: ./.github/actions/release-tool

      - name: Enforce release signing cutover policy
        id: release-signing
        env:
          RELEASE_IS_DRAFT: 'true'
        run: |
          set -euo pipefail
          policy_json="$("$KASSIBER_RELEASE_TOOL" manifest policy \
            --policy packaging/release/signing-policy.json)"
          policy_enabled="$(jq -r '.enabled' <<< "$policy_json")"
          if [ "$policy_enabled" = true ] && [ "$RELEASE_IS_DRAFT" != true ]; then
            echo "Signed-release policy is enabled; build a draft and publish it only through finalize-signed-release.yml." >&2
            exit 1
          fi
          echo "enabled=$policy_enabled" >> "$GITHUB_OUTPUT"

      - name: Download CLI release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: kassiber-cli-release-*
          path: release
          merge-multiple: true

      - name: Download desktop release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: kassiber-desktop-*-preview
          path: release
          merge-multiple: true

      - name: Verify release artifact set
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release -maxdepth 1 -type f -print -quit)"

          if find release -maxdepth 1 -type f -name 'kassiber-cli-*' ! -name '*.tar.gz' ! -name '*.zip' ! -name '*.deb' ! -name '*.rpm' -print -quit | grep -q .; then
            echo "Raw CLI sidecars must not be published as release assets." >&2
            find release -maxdepth 1 -type f -name 'kassiber-cli-*' ! -name '*.tar.gz' ! -name '*.zip' ! -name '*.deb' ! -name '*.rpm' >&2
            exit 1
          fi

      - name: Generate release manifest
        id: release-manifest
        shell: bash
        env:
          RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG_NAME#v}"
          "$KASSIBER_RELEASE_TOOL" manifest generate \
            --release-dir release \
            --version "$version"
          manifest_path="release/kassiber-${version}-manifest.txt"
          test -s "$manifest_path"
          echo "path=${manifest_path}" >> "$GITHUB_OUTPUT"

      - name: Never replace an already published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          # A missing release is allowed; API/auth failures are not.
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | [.tag_name, .draft] | @tsv')"
          state="$(printf '%s\n' "$releases" | awk -F '\t' -v tag="$TAG" '$1 == tag {print $2}')"
          test -z "$state" || test "$state" = true
          if [ "$state" = true ]; then
            echo 'Draft already exists; use a new tag/build rather than overwriting a signing handoff.' >&2
            exit 1
          fi
      - name: Extract reviewed release notes
        env:
          RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: '"$KASSIBER_RELEASE_TOOL" release-notes --version "$RELEASE_TAG_NAME" --output "$RUNNER_TEMP/release-notes.md"'
      - name: Create or update release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.release_channel == 'prerelease' }}
          draft: true
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            release/*

      - name: Check Homebrew tap publishing
        id: homebrew-tap
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_IS_DRAFT: 'true'
          RELEASE_SIGNING_ENABLED: ${{ steps.release-signing.outputs.enabled }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_SIGNING_ENABLED" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signed release metadata is published only after the finalizer verifies the manifest signature."
          elif [ "$RELEASE_IS_DRAFT" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release is a draft pending release-manifest signing; skipping Homebrew update."
          elif [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew cask update."
          fi

      - name: Check out Homebrew tap
        if: steps.homebrew-tap.outputs.enabled == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ env.HOMEBREW_TAP_REPOSITORY }}
          ref: ${{ env.HOMEBREW_TAP_BRANCH }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render Homebrew cask and CLI formula
        if: steps.homebrew-tap.outputs.enabled == 'true'
        shell: bash
        env:
          RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          RELEASE_MANIFEST_PATH: ${{ steps.release-manifest.outputs.path }}
        run: |
          set -euo pipefail
          tag_name="${RELEASE_TAG_NAME}"
          version="${tag_name#v}"

          release_sha256() {
            local name="$1"
            local sha256
            test -f "release/${name}"
            sha256="$(awk -v name="$name" '$2 == name { print $1 }' "$RELEASE_MANIFEST_PATH")"
            test -n "$sha256"
            printf '%s' "$sha256"
          }

          "$KASSIBER_RELEASE_TOOL" render-homebrew cask \
            --version "$version" \
            --sha256 "$(release_sha256 kassiber-macos-arm64.dmg)" \
            --output "homebrew-tap/${HOMEBREW_CASK_PATH}"

          "$KASSIBER_RELEASE_TOOL" render-homebrew cli-formula \
            --version "$version" \
            --sha256-macos-arm64 "$(release_sha256 kassiber-cli-macos-arm64.tar.gz)" \
            --sha256-linux-x64 "$(release_sha256 kassiber-cli-linux-x64.tar.gz)" \
            --output "homebrew-tap/${HOMEBREW_FORMULA_PATH}"

      - name: Commit Homebrew tap update
        if: steps.homebrew-tap.outputs.enabled == 'true'
        shell: bash
        working-directory: homebrew-tap
        env:
          RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          tag_name="${RELEASE_TAG_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HOMEBREW_CASK_PATH" "$HOMEBREW_FORMULA_PATH"

          if git diff --cached --quiet; then
            echo "Homebrew tap already matches ${tag_name}; nothing to push."
            exit 0
          fi

          git commit -m "Update Kassiber cask and CLI formula to ${tag_name}"
          git push origin "HEAD:${HOMEBREW_TAP_BRANCH}"
