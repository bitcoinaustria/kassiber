name: credential-platforms

on:
  pull_request:
    paths:
      - ".github/workflows/credential-platforms.yml"
      - "ui-tauri/src-tauri/**"
      - "tax-engine/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/credential-platforms.yml"
      - "ui-tauri/src-tauri/**"
      - "tax-engine/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/**"

concurrency:
  group: credential-platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  credential-contract:
    name: credential-contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Test desktop credential library
        run: cargo test --manifest-path ui-tauri/src-tauri/Cargo.toml --lib

      # The backend's own keychain, remembered-unlock and operator-broker
      # crates, on each platform's native credential store and process model.
      - name: Test backend credential, secrets and operator crates
        shell: bash
        env:
          KASSIBER_TEST_NO_EGRESS: strict
        # --no-fail-fast: a platform's failures in one crate must not hide
        # the others' (macOS and Windows run nowhere else).
        run: >-
          cargo test --locked --no-fail-fast
          --features kassiber-secrets/native-keyring
          -p kassiber-credentials
          -p kassiber-secrets
          -p kassiber-operator
          -p kassiber-ownership
          -p kassiber-ipc
