name: credential-platforms

on:
  # Pull requests run only on request: adding the `ci` label (see the note in
  # ci.yml and docs/reference/testing.md#pull-request-ci).
  pull_request:
    types: [labeled]
    paths:
      - ".github/workflows/credential-platforms.yml"
      - "tax-engine/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/credential-platforms.yml"
      - "tax-engine/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/**"

concurrency:
  # Another label's run does nothing; it must not cancel a requested run.
  group: credential-platforms-${{ (github.event_name == 'pull_request' && github.event.label.name != 'ci' && format('other-label-{0}', github.run_id)) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  credential-contract:
    name: credential-contract (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # The backend's own keychain, remembered-unlock and operator-broker
      # crates, on each platform's native credential store and process model.
      - name: Test backend credential, secrets and operator crates
        shell: bash
        env:
          KASSIBER_TEST_NO_EGRESS: strict
        # --no-fail-fast: a platform's failures in one crate must not hide
        # the others' (macOS and Windows run nowhere else).
        run: >-
          cargo test --locked --no-fail-fast
          --features kassiber-secrets/native-keyring
          -p kassiber-credentials
          -p kassiber-secrets
          -p kassiber-operator
          -p kassiber-ownership
          -p kassiber-ipc
