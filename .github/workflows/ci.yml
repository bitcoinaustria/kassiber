name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # uv builds the tax engine's binding with maturin. Never let maturin fetch
  # its own Rust toolchain mid-build; the setup-rust step installs the pinned one.
  MATURIN_NO_INSTALL_RUST: "1"
  # Tests that compare with the frozen tax oracle fail here, instead of
  # skipping, when its RP2 dev dependency is missing.
  KASSIBER_CI: "1"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: python-binding
          save-cache: "true"

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Compile Python
        run: uv run --locked python -m compileall -q kassiber tests scripts/python_test_shards.py

      - name: Validate disjoint Python shards
        run: uv run --locked python scripts/python_test_shards.py validate

      - name: Contract preflight
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          uv run --locked python scripts/python_test_shards.py run preflight --ci -- \
            --junitxml=test-results/preflight.xml \
            --durations=50 \
            -q 2>&1 | tee test-results/preflight.log

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-preflight-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  rust-binaries:
    name: Rust test binaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The parity suite only runs these; without debug info the build and
      # the artifact every lane downloads stay small (about 1 GB unpacked).
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: python-binding

      - name: Build the parity suite's Rust binaries
        run: scripts/build-rust-test-binaries.sh build

      - name: Pack the Rust test binaries
        run: scripts/build-rust-test-binaries.sh pack rust-test-binaries.tar

      - name: Upload the Rust test binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-test-binaries
          path: rust-test-binaries.tar
          if-no-files-found: error
          retention-days: 1

  python-tests:
    name: Python (${{ matrix.shard }}${{ matrix.part != '1/1' && format(' {0}', matrix.part) || '' }})
    needs:
      - preflight
      - rust-binaries
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard == 'serial-daemon' && 90 || 45 }}
    env:
      # Fail the lane when a test module reaches the tax engine but is
      # missing from the tax-shadow overlay (docs/reference/testing.md).
      KASSIBER_TEST_TAX_ENGINE: census
      KASSIBER_TEST_CUSTODY_ENGINE: census
      # The parity suite's binaries, built once by the rust-binaries job.
      KASSIBER_RUST_BIN: ${{ github.workspace }}/target/debug/kassiber
      KASSIBER_TEST_CUSTODY_LOADER_BIN: ${{ github.workspace }}/target/release/examples/custody-load
      KASSIBER_TEST_JOURNAL_PROCESS_BIN: ${{ github.workspace }}/target/release/examples/journal-process
    strategy:
      fail-fast: false
      matrix:
        shard:
          - core-accounting
          - wallets-sync
          - daemon-cli
          - security-replication
          - reports-contracts
          - serial-network
          - serial-daemon
          - serial-regressions
          - serial-integration
        # serial-daemon holds the subprocess parity suite, hours of tests run
        # one at a time; its jobs each run one part (`--part K/N`).
        part: ["1/1"]
        exclude:
          - shard: serial-daemon
        include:
          - shard: serial-daemon
            part: "1/8"
          - shard: serial-daemon
            part: "2/8"
          - shard: serial-daemon
            part: "3/8"
          - shard: serial-daemon
            part: "4/8"
          - shard: serial-daemon
            part: "5/8"
          - shard: serial-daemon
            part: "6/8"
          - shard: serial-daemon
            part: "7/8"
          - shard: serial-daemon
            part: "8/8"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: python-binding

      - name: Sync dependencies
        run: uv sync --locked

      - name: Download the Rust test binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rust-test-binaries

      - name: Unpack the Rust test binaries
        run: scripts/build-rust-test-binaries.sh unpack rust-test-binaries.tar

      - name: Run Python shard
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          uv run --locked python scripts/python_test_shards.py run "${{ matrix.shard }}" --ci --part "${{ matrix.part }}" -- \
            --junitxml="test-results/${{ matrix.shard }}.xml" \
            --durations=50 \
            -q 2>&1 | tee "test-results/${{ matrix.shard }}.log"

      - name: Summarize Python shard
        if: always()
        shell: bash
        run: |
          echo "### Python shard: ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "test-results/${{ matrix.shard }}.log" ]; then
            echo '<details><summary>Slowest tests / final output</summary>' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            sed -n '/slowest 50 durations/,$p' "test-results/${{ matrix.shard }}.log" | head -60 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '</details>' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-${{ matrix.shard }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  tax-shadow:
    name: Tax shadow (${{ matrix.shard }}${{ matrix.part != '1/1' && format(' {0}', matrix.part) || '' }})
    needs:
      - preflight
      - rust-binaries
    env:
      # The parity suite's binaries, built once by the rust-binaries job.
      KASSIBER_RUST_BIN: ${{ github.workspace }}/target/debug/kassiber
      KASSIBER_TEST_CUSTODY_LOADER_BIN: ${{ github.workspace }}/target/release/examples/custody-load
      KASSIBER_TEST_JOURNAL_PROCESS_BIN: ${{ github.workspace }}/target/release/examples/journal-process
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard == 'serial-daemon' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        # The lanes holding a module of the tax-shadow overlay
        # (`python scripts/python_test_shards.py list-shadow`).
        shard:
          - core-accounting
          - wallets-sync
          - daemon-cli
          - security-replication
          - reports-contracts
          - serial-network
          - serial-daemon
          - serial-regressions
          - serial-integration
        # serial-daemon holds the subprocess parity suite, hours of tests run
        # one at a time; its jobs each run one part (`--part K/N`).
        part: ["1/1"]
        exclude:
          - shard: serial-daemon
        include:
          - shard: serial-daemon
            part: "1/8"
          - shard: serial-daemon
            part: "2/8"
          - shard: serial-daemon
            part: "3/8"
          - shard: serial-daemon
            part: "4/8"
          - shard: serial-daemon
            part: "5/8"
          - shard: serial-daemon
            part: "6/8"
          - shard: serial-daemon
            part: "7/8"
          - shard: serial-daemon
            part: "8/8"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: python-binding

      - name: Sync dependencies
        run: uv sync --locked

      - name: Download the Rust test binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rust-test-binaries

      - name: Unpack the Rust test binaries
        run: scripts/build-rust-test-binaries.sh unpack rust-test-binaries.tar

      - name: Compare production with the tax oracle
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          uv run --locked python scripts/python_test_shards.py run-shadow "${{ matrix.shard }}" --ci --part "${{ matrix.part }}" -- \
            --junitxml="test-results/tax-shadow-${{ matrix.shard }}.xml" \
            --durations=50 \
            -q 2>&1 | tee "test-results/tax-shadow-${{ matrix.shard }}.log"

      - name: Summarize tax shadow
        if: always()
        shell: bash
        run: |
          echo "### Tax shadow: ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "test-results/tax-shadow-${{ matrix.shard }}.log" ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            sed -n '/tax engine shadow/,$p' "test-results/tax-shadow-${{ matrix.shard }}.log" | head -30 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload tax shadow report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-tax-shadow-${{ matrix.shard }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  custody-shadow:
    name: Custody shadow (${{ matrix.shard }}${{ matrix.part != '1/1' && format(' {0}', matrix.part) || '' }})
    env:
      # The parity suite's binaries, built once by the rust-binaries job.
      KASSIBER_RUST_BIN: ${{ github.workspace }}/target/debug/kassiber
      KASSIBER_TEST_CUSTODY_LOADER_BIN: ${{ github.workspace }}/target/release/examples/custody-load
      KASSIBER_TEST_JOURNAL_PROCESS_BIN: ${{ github.workspace }}/target/release/examples/journal-process
    needs:
      - preflight
      - rust-binaries
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard == 'serial-daemon' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        # The same complete overlay and ordering policy as the tax-shadow lane.
        shard:
          - core-accounting
          - wallets-sync
          - daemon-cli
          - security-replication
          - reports-contracts
          - serial-network
          - serial-daemon
          - serial-regressions
          - serial-integration
        # serial-daemon holds the subprocess parity suite, hours of tests run
        # one at a time; its jobs each run one part (`--part K/N`).
        part: ["1/1"]
        exclude:
          - shard: serial-daemon
        include:
          - shard: serial-daemon
            part: "1/8"
          - shard: serial-daemon
            part: "2/8"
          - shard: serial-daemon
            part: "3/8"
          - shard: serial-daemon
            part: "4/8"
          - shard: serial-daemon
            part: "5/8"
          - shard: serial-daemon
            part: "6/8"
          - shard: serial-daemon
            part: "7/8"
          - shard: serial-daemon
            part: "8/8"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: python-binding

      - name: Sync dependencies
        run: uv sync --locked

      - name: Download the Rust test binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rust-test-binaries

      - name: Unpack the Rust test binaries
        run: scripts/build-rust-test-binaries.sh unpack rust-test-binaries.tar

      - name: Compare pure production with frozen SQL composition
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          uv run --locked python scripts/python_test_shards.py run-custody-shadow "${{ matrix.shard }}" --ci --part "${{ matrix.part }}" -- \
            --junitxml="test-results/custody-shadow-${{ matrix.shard }}.xml" \
            --durations=50 \
            -q 2>&1 | tee "test-results/custody-shadow-${{ matrix.shard }}.log"

      - name: Summarize custody shadow
        if: always()
        shell: bash
        run: |
          echo "### Custody shadow (${{ matrix.shard }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "test-results/custody-shadow-${{ matrix.shard }}.log" ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            sed -n '/custody engine shadow/,$p' "test-results/custody-shadow-${{ matrix.shard }}.log" | head -30 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload custody shadow report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-custody-shadow-${{ matrix.shard }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui-tauri/pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm --dir ui-tauri install --frozen-lockfile

      - name: Desktop UI typecheck
        run: pnpm --dir ui-tauri run typecheck

      - name: Desktop UI lint
        run: pnpm --dir ui-tauri run lint

      - name: Run Vitest
        run: |
          mkdir -p test-results
          pnpm --dir ui-tauri exec vitest run \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=../test-results/vitest.xml

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vitest-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  cli-smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: python-binding

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run CLI smoke
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          uv run --locked python scripts/python_test_shards.py run cli-smoke --ci -- \
            --junitxml=test-results/cli-smoke.xml \
            --durations=50 \
            -q 2>&1 | tee test-results/cli-smoke.log

      - name: Summarize CLI smoke
        if: always()
        shell: bash
        run: |
          echo "### CLI smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/cli-smoke.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            sed -n '/slowest 50 durations/,$p' test-results/cli-smoke.log | head -60 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload CLI smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-cli-smoke-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  tax-engine:
    name: Rust crates
    runs-on: ubuntu-latest
    # With every backend crate the workspace's test binaries alone run about
    # 18 minutes on the build machine (4 test threads), before this job's
    # builds and clippy.
    timeout-minutes: 60
    env:
      # With debug info the workspace's test build outgrows the runner's disk
      # ("No space left on device" while linking): 11 GB without it, 32 GB
      # or more with line tables only. Panic messages keep their file and line.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      # rust-toolchain.toml pins one toolchain for every crate and workflow.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-workspace
          save-cache: "true"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --features kassiber-journals/test-harness --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --features kassiber-journals/test-harness --locked

      - name: Verify ledger bytes under custody JSON features
        run: python3 crates/custody/scripts/check_ledger_features.py

      # The egress observer only exists in harness builds; test it there too.
      - name: Run egress observer tests
        run: cargo test -p kassiber-net --features test-observer --locked

      # The binary's harness build adds the observer, the in-memory store, and
      # the daemon's protocol test kinds; the supervisor-rule tests need it.
      - name: Lint and test the Rust shell harness
        run: |
          cargo clippy -p kassiber -p kassiber-daemon -p kassiber-runtime --all-targets --features kassiber/test-harness --locked -- -D warnings
          cargo test -p kassiber --features test-harness --locked

  chain-observers:
    name: Chain observers (Linux Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Detect observer-sensitive changes
        id: observer_paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA"...HEAD -- \
            .github/workflows/ci.yml \
            kassiber/core/chain_observer \
            kassiber/core/chain_analysis \
            'kassiber/core/chain_analysis_*.py' \
            'kassiber/chain_analysis_*_schema.py' \
            scripts/chain-analysis-regtest.sh \
            kassiber/core/esplora_history.py \
            kassiber/core/sync.py \
            kassiber/core/sync_backends.py \
            kassiber/proxy.py \
            kassiber/wallet_descriptors.py \
            kassiber/wallet_security.py \
            kassiber/db.py \
            dev/regtest \
            scripts/integration-harness.sh \
            tests/integration \
            pyproject.toml \
            uv.lock; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.observer_paths.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install uv
        if: steps.observer_paths.outputs.run == 'true'
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust
        if: steps.observer_paths.outputs.run == 'true'
        uses: ./.github/actions/setup-rust
        with:
          cache-key: python-binding

      - name: Sync dependencies
        if: steps.observer_paths.outputs.run == 'true'
        run: uv sync --locked

      - name: Dependency-backed chain-observer oracle
        if: steps.observer_paths.outputs.run == 'true'
        run: ./scripts/integration-harness.sh chain-observers

      - name: Local chain-analysis Core oracle
        if: steps.observer_paths.outputs.run == 'true'
        run: ./scripts/integration-harness.sh chain-analysis

      - name: No observer-sensitive changes
        if: steps.observer_paths.outputs.run != 'true'
        run: echo "The dependency-backed chain-observer lane is not required for this change."

  required:
    name: required
    if: always()
    needs:
      - preflight
      - rust-binaries
      - python-tests
      - tax-shadow
      - custody-shadow
      - frontend
      - cli-smoke
      - tax-engine
      - chain-observers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record required-check results
        run: |
          echo "### Required CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preflight: ${{ needs.preflight.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rust test binaries: ${{ needs.rust-binaries.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python shards: ${{ needs.python-tests.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custody shadow: ${{ needs.custody-shadow.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tax shadow: ${{ needs.tax-shadow.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: ${{ needs.frontend.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CLI smoke: ${{ needs.cli-smoke.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rust crates: ${{ needs.tax-engine.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Chain observers: ${{ needs.chain-observers.result }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce required checks
        if: ${{ needs.preflight.result != 'success' || needs.rust-binaries.result != 'success' || needs.python-tests.result != 'success' || needs.tax-shadow.result != 'success' || needs.custody-shadow.result != 'success' || needs.frontend.result != 'success' || needs.cli-smoke.result != 'success' || needs.tax-engine.result != 'success' || needs.chain-observers.result != 'success' }}
        run: exit 1
