name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui-tauri/pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm --dir ui-tauri install --frozen-lockfile

      - name: Desktop UI typecheck
        run: pnpm --dir ui-tauri run typecheck

      - name: Desktop UI lint
        run: pnpm --dir ui-tauri run lint

      - name: Run Vitest
        run: |
          mkdir -p test-results
          pnpm --dir ui-tauri exec vitest run \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=../test-results/vitest.xml

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vitest-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  tax-engine:
    name: Rust crates
    runs-on: ubuntu-latest
    # With every backend crate the workspace's test binaries alone run about
    # 18 minutes on the build machine (4 test threads), before this job's
    # builds and clippy.
    timeout-minutes: 60
    env:
      # With debug info the workspace's test build outgrows the runner's disk
      # ("No space left on device" while linking): 11 GB without it, 32 GB
      # or more with line tables only. Panic messages keep their file and line.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      # rust-toolchain.toml pins one toolchain for every crate and workflow.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-workspace
          save-cache: "true"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --features kassiber-journals/test-harness --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --features kassiber-journals/test-harness --locked

      - name: Verify ledger bytes under custody JSON features
        run: scripts/check-ledger-features.sh

      # Every catalog entry applies to the tree and belongs to a suite.
      - name: Validate mutation catalogs
        run: cargo run --locked -p kassiber-mutation-check -- check

      # The network tape (crates/net/src/tape.rs) is test-observer code; a
      # product build of the binary must not contain it.
      - name: Product build carries no test network tape
        run: |
          cargo build --locked -p kassiber
          scripts/check-no-test-tape.sh target/debug/kassiber

      # The egress observer only exists in harness builds; test it there too.
      - name: Run egress observer tests
        run: cargo test -p kassiber-net --features test-observer --locked

      # The shell harness's parity tests (legacy_privacy_transport,
      # privacy_reports, psbt_privacy) compare against the Python reference
      # through `.venv/bin/python`; the steps above need no Python.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --locked

      # The binary's harness build adds the observer, the in-memory store, and
      # the daemon's protocol test kinds; the supervisor-rule tests need it.
      - name: Lint and test the Rust shell harness
        run: |
          cargo clippy -p kassiber -p kassiber-daemon -p kassiber-runtime --all-targets --features kassiber/test-harness --locked -- -D warnings
          # `cargo build` writes target/debug/kassiber.d; `cargo test` alone
          # does not, and the Python reference refuses a binary without it.
          cargo build -p kassiber --bin kassiber --features test-harness --locked
          cargo test -p kassiber --features test-harness --locked

  session-replay:
    name: Recorded sessions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-session-replay
          save-cache: "true"

      # A replay recreates each session's recorded paths under /mnt in a
      # user and mount namespace (docs/plan/22-python-removal.md#session-replay).
      # Ubuntu runners restrict unprivileged user namespaces through
      # AppArmor; this job lifts that restriction for its own runner only.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Replay the recorded product sessions
        run: scripts/replay-sessions.sh

      - name: Upload the replay report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-replay-${{ github.run_attempt }}
          path: target/session-replay-report.tsv
          if-no-files-found: warn
          retention-days: 7

  required:
    name: required
    if: always()
    needs:
      - frontend
      - tax-engine
      - session-replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record required-check results
        run: |
          echo "### Required CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: ${{ needs.frontend.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rust crates: ${{ needs.tax-engine.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recorded sessions: ${{ needs.session-replay.result }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce required checks
        if: ${{ needs.frontend.result != 'success' || needs.tax-engine.result != 'success' || needs.session-replay.result != 'success' }}
        run: exit 1
