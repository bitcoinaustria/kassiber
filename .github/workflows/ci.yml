name: ci

on:
  pull_request:
  push:
    branches:
      - main
  # Runs only the desktop app checks on one OS, on the branch it is started
  # from: the macOS and Windows desktop checks for a change merged without them.
  workflow_dispatch:
    inputs:
      desktop_os:
        description: Desktop app checks to run
        required: true
        default: windows-latest
        type: choice
        options:
          - windows-latest
          - macos-latest
          - ubuntu-latest

concurrency:
  # Manual desktop runs get their own group so they never cancel main's CI.
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}', inputs.desktop_os, github.ref) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A pull request into another pull request's branch (a stacked layer) runs the
# fast lane: frontend, Rust crates, tooling and the Linux desktop build. The
# recorded-session replay (32 runners), the chain-observer harness and the
# macOS/Windows desktop builds run on pull requests into main and on main
# itself. A stack therefore pays the full lane once, on the layer that targets
# main; each layer pays it again when it becomes that layer. The condition is
# spelled out per job because job-level `if:` cannot read workflow `env`:
#   github.event_name == 'push' || github.base_ref == 'main'
# A manual run (workflow_dispatch) runs only the desktop job, on the chosen OS.

jobs:
  frontend:
    name: Frontend checks
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # The redaction corpora the Vitest suites read are locked test data.
      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui-tauri/pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm --dir ui-tauri install --frozen-lockfile

      - name: Desktop UI typecheck
        run: pnpm --dir ui-tauri run typecheck

      - name: Desktop UI lint
        run: pnpm --dir ui-tauri run lint

      - name: Run Vitest
        run: |
          mkdir -p test-results
          pnpm --dir ui-tauri exec vitest run \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=../test-results/vitest.xml

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vitest-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  tax-engine:
    name: Rust crates
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # With every backend crate the workspace's test binaries alone run about
    # 18 minutes on the build machine (4 test threads), before this job's
    # builds and clippy.
    timeout-minutes: 60
    env:
      # With debug info the workspace's test build outgrows the runner's disk
      # ("No space left on device" while linking): 11 GB without it, 32 GB
      # or more with line tables only. Panic messages keep their file and line.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      # rust-toolchain.toml pins one toolchain for every crate and workflow.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-workspace
          save-cache: "true"

      # The document import and chat PDF paths run Poppler, as the product
      # does; without it their tests skip and recorded sessions differ.
      - name: Install Poppler
        # The runners' Ubuntu mirror has had resolver outages of several
        # minutes; retry with backoff instead of failing the job.
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
          command -v pdftotext pdfinfo pdftoppm

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --features kassiber-journals/test-harness --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --features kassiber-journals/test-harness --locked

      - name: Verify ledger bytes under custody JSON features
        run: scripts/check-ledger-features.sh

      # Release CI packages into a relative output directory; both archive
      # formats must land there.
      - name: Check the CLI archive packaging
        run: scripts/check-cli-archive.sh

      # Every catalog entry applies to the tree and belongs to a suite.
      - name: Validate mutation catalogs
        run: cargo run --locked -p kassiber-mutation-check -- check

      # The network tape (crates/net/src/tape.rs) is test-observer code; a
      # product build of the binary must not contain it.
      - name: Product build carries no test network tape
        run: |
          cargo build --locked -p kassiber
          scripts/check-no-test-tape.sh target/debug/kassiber

      # The egress observer only exists in harness builds; test it there too.
      - name: Run egress observer tests
        run: cargo test -p kassiber-net --features test-observer --locked

      # The binary's harness build adds the observer, the in-memory store, and
      # the daemon's protocol test kinds; the supervisor-rule tests need it.
      - name: Lint and test the Rust shell harness
        run: |
          cargo clippy -p kassiber -p kassiber-daemon -p kassiber-runtime --all-targets --features kassiber/test-harness --locked -- -D warnings
          cargo test -p kassiber --features test-harness --locked

  tooling:
    name: Tooling scripts
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Standard-library tests of the packaging, publishing and harness
      # scripts, run isolated like the regtest harness (plan 22, D2); the
      # product-free check keeps every such module off the Python product.
      - name: Run the tooling tests
        run: |
          python3 -I -m unittest discover -s tests/tooling -t . -v
          python3 -I -m unittest discover -s tests/integration -t . -p test_product_free.py -v

  session-replay-build:
    name: Recorded sessions (build)
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The binary and every example the recordings name, built without debug
      # info so the build fits the runner's disk and the artifact stays small.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-session-replay
          save-cache: "true"

      - name: Build the replayed binaries
        run: scripts/replay-sessions.sh build

      - name: Pack the replayed binaries
        run: scripts/replay-sessions.sh pack replay-binaries.tar

      - name: Upload the replayed binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-binaries
          path: replay-binaries.tar
          if-no-files-found: error
          retention-days: 1

  session-replay:
    name: Recorded sessions (${{ matrix.part }})
    needs: session-replay-build
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    # About 24,000 sessions take hours on one 4-core runner. Each part
    # replays every 32nd session (session-replay --part K/N): about 760
    # sessions, 16 minutes with 4 jobs locally, about 20-25 on a runner.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ["1/32", "2/32", "3/32", "4/32", "5/32", "6/32", "7/32", "8/32",
               "9/32", "10/32", "11/32", "12/32", "13/32", "14/32", "15/32", "16/32",
               "17/32", "18/32", "19/32", "20/32", "21/32", "22/32", "23/32",
               "24/32", "25/32", "26/32", "27/32", "28/32", "29/32", "30/32",
               "31/32", "32/32"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Download the replayed binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: replay-binaries

      - name: Unpack the replayed binaries
        run: scripts/replay-sessions.sh unpack replay-binaries.tar

      # Debug builds of age read its message catalogue (rust-embed) from the
      # crate's registry source at run time; without it the first age error
      # message panics. The pinned toolchain fetches the same registry path
      # the build job compiled against.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Fetch Rust crates
        run: cargo fetch --locked

      # The document import and chat PDF paths run Poppler, as the product
      # does; without it their tests skip and recorded sessions differ.
      - name: Install Poppler
        # The runners' Ubuntu mirror has had resolver outages of several
        # minutes; retry with backoff instead of failing the job.
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
          command -v pdftotext pdfinfo pdftoppm

      # A replay recreates each session's recorded paths under /mnt in a
      # user and mount namespace (docs/plan/22-python-removal.md#session-replay).
      # Ubuntu runners restrict unprivileged user namespaces through
      # AppArmor; this job lifts that restriction for its own runner only.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Replay this part of the recorded product sessions
        env:
          KASSIBER_REPLAY_PREBUILT: "1"
        run: scripts/replay-sessions.sh --part "${{ matrix.part }}"

      - name: Upload the replay report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-replay-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: target/session-replay-report.tsv
          if-no-files-found: warn
          retention-days: 7

  chain-observers:
    name: Chain observers (Linux Docker)
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Detect observer-sensitive changes
        id: observer_paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA"...HEAD -- \
            .github/workflows/ci.yml \
            crates/chain \
            crates/wallets \
            crates/store \
            crates/net \
            crates/cli \
            crates/kassiber \
            Cargo.toml \
            Cargo.lock \
            rust-toolchain.toml \
            scripts/chain-analysis-regtest.sh \
            dev/regtest \
            scripts/integration-harness.sh \
            tests/integration; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.observer_paths.outputs.run == 'true'
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-chain-observers
          save-cache: "true"

      # The harness drives this binary (its default, target/release/kassiber);
      # the harness itself is standard-library python3 -I on the runner's
      # interpreter, with no uv and no virtual environment.
      - name: Build the kassiber binary
        if: steps.observer_paths.outputs.run == 'true'
        run: cargo build --locked --release -p kassiber

      - name: Chain-observer node-truth oracle and live BDK/LWK observers
        if: steps.observer_paths.outputs.run == 'true'
        run: ./scripts/integration-harness.sh chain-observers

      - name: Local chain-analysis Core oracle
        if: steps.observer_paths.outputs.run == 'true'
        run: ./scripts/integration-harness.sh chain-analysis

      - name: No observer-sensitive changes
        if: steps.observer_paths.outputs.run != 'true'
        run: echo "The dependency-backed chain-observer lane is not required for this change."

  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Stacked layers build Linux only; see the lane note at the top.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.desktop_os) || ((github.event_name == 'push' || github.base_ref == 'main') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]')) }}
    env:
      # As in the Rust crates job: no debug info keeps the test build within
      # the runner's disk. Panic messages keep their file and line.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      KASSIBER_NO_EGRESS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Rune's Linux build links fontconfig (parley's system font source) and
      # compiles wayland-backend's C shim; winit, wgpu, AccessKit, D-Bus and the
      # file dialog portal are pure Rust or load their libraries at run time.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 30))
          done

      # The redaction test compares the app's floor with the backend's scanner
      # corpus, which is locked test data.
      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      # The desktop crate is its own Cargo workspace with its own target
      # directory, cached apart from the root workspace's.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-desktop-${{ runner.os }}
          save-cache: "true"
          workspaces: crates/kassiber-desktop -> target

      # The scene check (`--scenes-only`) is not run here yet: on the empty
      # book CI would create, each Transactions scene waits out its 30 s load
      # deadline, so a full run takes hours (TODO.md, "Desktop and handoffs").
      - name: Format, lint (with and without agent tooling) and unit tests
        shell: bash
        run: crates/kassiber-desktop/packaging/ci/rune-checks.sh --skip-scenes

  required:
    name: required
    if: always() && github.event_name != 'workflow_dispatch'
    needs:
      - frontend
      - tax-engine
      - session-replay
      - tooling
      - chain-observers
      - desktop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record required-check results
        run: |
          echo "### Required CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: ${{ needs.frontend.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rust crates: ${{ needs.tax-engine.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recorded sessions: ${{ needs.session-replay.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tooling scripts: ${{ needs.tooling.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Chain observers: ${{ needs.chain-observers.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Desktop app: ${{ needs.desktop.result }}" >> "$GITHUB_STEP_SUMMARY"

      # The full-lane jobs are skipped, not failed, on stacked layers; there a
      # skip counts as passing. Into main and on main every job must succeed.
      - name: Enforce required checks
        env:
          FULL_LANE: ${{ github.event_name == 'push' || github.base_ref == 'main' }}
          RESULTS: >-
            ${{ needs.frontend.result }} ${{ needs.tax-engine.result }}
            ${{ needs.tooling.result }} ${{ needs.desktop.result }}
          FULL_LANE_RESULTS: >-
            ${{ needs.session-replay.result }} ${{ needs.chain-observers.result }}
        shell: bash
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
          for result in $FULL_LANE_RESULTS; do
            if [ "$result" = success ]; then continue; fi
            if [ "$FULL_LANE" != true ] && [ "$result" = skipped ]; then continue; fi
            exit 1
          done
