name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui-tauri/pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm --dir ui-tauri install --frozen-lockfile

      - name: Desktop UI typecheck
        run: pnpm --dir ui-tauri run typecheck

      - name: Desktop UI lint
        run: pnpm --dir ui-tauri run lint

      - name: Run Vitest
        run: |
          mkdir -p test-results
          pnpm --dir ui-tauri exec vitest run \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=../test-results/vitest.xml

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vitest-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  tax-engine:
    name: Rust crates
    runs-on: ubuntu-latest
    # With every backend crate the workspace's test binaries alone run about
    # 18 minutes on the build machine (4 test threads), before this job's
    # builds and clippy.
    timeout-minutes: 60
    env:
      # With debug info the workspace's test build outgrows the runner's disk
      # ("No space left on device" while linking): 11 GB without it, 32 GB
      # or more with line tables only. Panic messages keep their file and line.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      # rust-toolchain.toml pins one toolchain for every crate and workflow.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-workspace
          save-cache: "true"

      # The document import and chat PDF paths run Poppler, as the product
      # does; without it their tests skip and recorded sessions differ.
      - name: Install Poppler
        # The runners' Ubuntu mirror has had resolver outages of several
        # minutes; retry with backoff instead of failing the job.
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
          command -v pdftotext pdfinfo pdftoppm

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --features kassiber-journals/test-harness --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --features kassiber-journals/test-harness --locked

      - name: Verify ledger bytes under custody JSON features
        run: scripts/check-ledger-features.sh

      # Release CI packages into a relative output directory; both archive
      # formats must land there.
      - name: Check the CLI archive packaging
        run: scripts/check-cli-archive.sh

      # Every catalog entry applies to the tree and belongs to a suite.
      - name: Validate mutation catalogs
        run: cargo run --locked -p kassiber-mutation-check -- check

      # The network tape (crates/net/src/tape.rs) is test-observer code; a
      # product build of the binary must not contain it.
      - name: Product build carries no test network tape
        run: |
          cargo build --locked -p kassiber
          scripts/check-no-test-tape.sh target/debug/kassiber

      # The egress observer only exists in harness builds; test it there too.
      - name: Run egress observer tests
        run: cargo test -p kassiber-net --features test-observer --locked

      # The binary's harness build adds the observer, the in-memory store, and
      # the daemon's protocol test kinds; the supervisor-rule tests need it.
      - name: Lint and test the Rust shell harness
        run: |
          cargo clippy -p kassiber -p kassiber-daemon -p kassiber-runtime --all-targets --features kassiber/test-harness --locked -- -D warnings
          cargo test -p kassiber --features test-harness --locked

  session-replay:
    name: Recorded sessions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The binary and every example the recordings name, built without debug
      # info so the build fits the runner's disk, as in the Rust crates job.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-session-replay
          save-cache: "true"

      # The document import and chat PDF paths run Poppler, as the product
      # does; without it their tests skip and recorded sessions differ.
      - name: Install Poppler
        # The runners' Ubuntu mirror has had resolver outages of several
        # minutes; retry with backoff instead of failing the job.
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
          command -v pdftotext pdfinfo pdftoppm

      # A replay recreates each session's recorded paths under /mnt in a
      # user and mount namespace (docs/plan/22-python-removal.md#session-replay).
      # Ubuntu runners restrict unprivileged user namespaces through
      # AppArmor; this job lifts that restriction for its own runner only.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Replay the recorded product sessions
        run: scripts/replay-sessions.sh

      - name: Upload the replay report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-replay-${{ github.run_attempt }}
          path: target/session-replay-report.tsv
          if-no-files-found: warn
          retention-days: 7

  chain-observers:
    name: Chain observers (Linux Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Detect observer-sensitive changes
        id: observer_paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA"...HEAD -- \
            .github/workflows/ci.yml \
            crates/chain \
            crates/wallets \
            crates/store \
            crates/net \
            crates/cli \
            crates/kassiber \
            Cargo.toml \
            Cargo.lock \
            rust-toolchain.toml \
            scripts/chain-analysis-regtest.sh \
            dev/regtest \
            scripts/integration-harness.sh \
            tests/integration; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.observer_paths.outputs.run == 'true'
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-chain-observers
          save-cache: "true"

      # The harness drives this binary (its default, target/release/kassiber);
      # the harness itself is standard-library python3 -I on the runner's
      # interpreter, with no uv and no virtual environment.
      - name: Build the kassiber binary
        if: steps.observer_paths.outputs.run == 'true'
        run: cargo build --locked --release -p kassiber

      - name: Chain-observer node-truth oracle and live BDK/LWK observers
        if: steps.observer_paths.outputs.run == 'true'
        run: ./scripts/integration-harness.sh chain-observers

      - name: Local chain-analysis Core oracle
        if: steps.observer_paths.outputs.run == 'true'
        run: ./scripts/integration-harness.sh chain-analysis

      - name: No observer-sensitive changes
        if: steps.observer_paths.outputs.run != 'true'
        run: echo "The dependency-backed chain-observer lane is not required for this change."

  required:
    name: required
    if: always()
    needs:
      - frontend
      - tax-engine
      - session-replay
      - chain-observers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record required-check results
        run: |
          echo "### Required CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: ${{ needs.frontend.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rust crates: ${{ needs.tax-engine.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recorded sessions: ${{ needs.session-replay.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Chain observers: ${{ needs.chain-observers.result }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce required checks
        if: ${{ needs.frontend.result != 'success' || needs.tax-engine.result != 'success' || needs.session-replay.result != 'success' || needs.chain-observers.result != 'success' }}
        run: exit 1
