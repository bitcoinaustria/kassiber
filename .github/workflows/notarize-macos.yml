name: notarize-macos

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing draft release tag or unpublished candidate ID
        required: true
        type: string
      candidate:
        description: Notarize an unpublished candidate; never publish or create a Git tag
        required: false
        default: false
        type: boolean
      source_commit:
        description: Candidate only; full source commit already in main history
        required: false
        type: string
      input_sha256:
        description: Recovery only; SHA-256 printed by the local signing helper
        required: false
        type: string
      build_run_id:
        description: Normal release path; successful prerelease-binaries run to sign in CI
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-seal-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  notarize:
    environment: macos-notarization
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Require trusted workflow
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download draft and bind source commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
          CANDIDATE: ${{ inputs.candidate }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          INPUT_SHA256: ${{ inputs.input_sha256 }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          if [ "$CANDIDATE" = true ]; then
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$TAG" =~ ^macos-candidate-${SOURCE_COMMIT}-[0-9]+$ ]] || exit 1
            test "$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)" = "$SOURCE_COMMIT"
            remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG")"
            test -z "$remote_tag"
            commit="$SOURCE_COMMIT"
            version="$(git show "$commit:pyproject.toml" | python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
            echo "candidate_id=$TAG" >> "$GITHUB_OUTPUT"
          else
            test -z "$SOURCE_COMMIT"
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
            commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
            version="${TAG#v}"
            echo 'candidate_id=' >> "$GITHUB_OUTPUT"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
          git merge-base --is-ancestor "$commit" origin/main
          mkdir incoming
          gh release download "$TAG" --dir incoming
          # Never rewrite a set an operator has already OpenPGP-signed.
          test -z "$(find incoming -name '*.asc' -print -quit)"
          if [ -n "$BUILD_RUN_ID" ]; then
            test "$CANDIDATE" = false
            test -z "$SOURCE_COMMIT"
            test -z "$INPUT_SHA256"
            [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
            test ! -e incoming/kassiber-macos-signing-input.dmg
          else
            test -n "$INPUT_SHA256"
            test -f incoming/kassiber-macos-signing-input.dmg
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install signing and notarization credentials in a temporary keychain
        id: credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$NOTARY_KEY_P8"
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER_ID"
          keychain="$RUNNER_TEMP/notary.keychain-db"
          keychain_unlock="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_unlock"
          security create-keychain -p "$keychain_unlock" "$keychain"
          security unlock-keychain -p "$keychain_unlock" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security list-keychains -d user -s "$keychain"
          if [ -n "${{ inputs.build_run_id }}" ]; then
            test -n "$MACOS_CERTIFICATE_P12_BASE64"
            test -n "$MACOS_CERTIFICATE_PASSWORD"
            test -n "$MACOS_PROVISIONING_PROFILE_BASE64"
            printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
            printf '%s' "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/DeveloperID.provisionprofile"
            security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s \
              -k "$keychain_unlock" "$keychain"
            identities="$(security find-identity -v -p codesigning "$keychain")"
            identity="$(printf '%s\n' "$identities" | sed -nE \
              '/Developer ID Application: .*\(6Q4R2C3GJK\)/s/.* ([0-9A-F]{40}) .*/\1/p')"
            test "$(printf '%s\n' "$identity" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
            echo "identity=$identity" >> "$GITHUB_OUTPUT"
          fi
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials kassiber-notary \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"
          rm "$RUNNER_TEMP/notary.p8"
      - name: Sign exact release build in CI
        if: inputs.build_run_id != ''
        id: sign
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          IDENTITY: ${{ steps.credentials.outputs.identity }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_macos_release.py \
            --tag "$TAG" --run-id "$BUILD_RUN_ID" --identity "$IDENTITY" \
            --provisioning-profile "$RUNNER_TEMP/DeveloperID.provisionprofile" \
            --work-dir "$RUNNER_TEMP/release-signing"
          cp "$RUNNER_TEMP/release-signing/signed/kassiber-macos-signing-input.dmg" incoming/
          digest="$(shasum -a 256 incoming/kassiber-macos-signing-input.dmg | awk '{print $1}')"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Notarize and verify sealed distributions
        env:
          LOCAL_SHA256: ${{ inputs.input_sha256 }}
          CI_SHA256: ${{ steps.sign.outputs.sha256 }}
          COMMIT: ${{ steps.release.outputs.commit }}
          VERSION: ${{ steps.release.outputs.version }}
          CANDIDATE_ID: ${{ steps.release.outputs.candidate_id }}
        run: |
          set -euo pipefail
          EXPECTED_SHA256="${CI_SHA256:-$LOCAL_SHA256}"
          test -n "$EXPECTED_SHA256"
          python3 scripts/macos_release.py notarize \
            --image incoming/kassiber-macos-signing-input.dmg \
            --sha256 "$EXPECTED_SHA256" --commit "$COMMIT" --version "$VERSION" \
            --candidate-id "$CANDIDATE_ID" \
            --profile kassiber-notary --keychain "$RUNNER_TEMP/notary.keychain-db" --output notarized
          python3 scripts/macos_release.py verify \
            --release-dir notarized --commit "$COMMIT" --version "$VERSION" --candidate-id "$CANDIDATE_ID"
      - name: Preserve notarization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notarization-evidence
          path: notarized/notarization.json
          if-no-files-found: ignore
      - name: Update verified draft macOS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          CANDIDATE_ID: ${{ steps.release.outputs.candidate_id }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          if [ -n "$CANDIDATE_ID" ]; then
            test "$TAG" = "$CANDIDATE_ID"
            test "$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)" = "$COMMIT"
            remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG")"
            test -z "$remote_tag"
          else
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$COMMIT"
          fi
          asset_names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          test -z "$(printf '%s\n' "$asset_names" | sed -n '/\.asc$/p')"
          cp notarized/kassiber-macos-arm64.app.zip incoming/
          cp notarized/kassiber-macos-arm64.dmg incoming/
          cp notarized/kassiber-cli-macos-arm64.tar.gz incoming/
          rm incoming/kassiber-macos-signing-input.dmg
          if [ -n "$CANDIDATE_ID" ]; then
            gh release upload "$TAG" --clobber \
              incoming/kassiber-macos-arm64.app.zip incoming/kassiber-macos-arm64.dmg \
              incoming/kassiber-cli-macos-arm64.tar.gz
            echo 'Notarized candidate remains unpublished in its draft. No version tag, finalizer or package-channel update was created.' >> "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/release_manifest.py generate --release-dir incoming --version "$VERSION"
            gh release upload "$TAG" --clobber \
              incoming/kassiber-macos-arm64.app.zip incoming/kassiber-macos-arm64.dmg \
              incoming/kassiber-cli-macos-arm64.tar.gz "incoming/kassiber-$VERSION-manifest.txt"
            echo 'Notarized draft ready. Download and independently verify the final artifacts before offline OpenPGP signing.' >> "$GITHUB_STEP_SUMMARY"
          fi
          gh release delete-asset "$TAG" kassiber-macos-signing-input.dmg --yes
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/DeveloperID.provisionprofile"
          security delete-keychain "$RUNNER_TEMP/notary.keychain-db" || true
