name: integration

# Opt-in real-node integration lanes for issue #312 (item 10: manual/nightly CI).
#
# This workflow is intentionally NOT triggered on pull_request or push, so it
# never gates normal PR CI (that stays in ci.yml). The generated-truth demo lane
# runs weekly because it is the broad oracle for issue #312. The harness drives
# the Rust binary with stdlib-only Python (python3 -I, no uv). Lanes that ran
# Python test modules left with the Python test suite.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Integration lane to run"
        type: choice
        default: demo-full
        options:
          - demo-full
  schedule:
    # Weekly generated-truth demo oracle over disposable Bitcoin + Liquid regtest.
    - cron: "47 3 * * 0"

jobs:
  scheduled-demo-full:
    # Weekly scheduled generated-truth oracle. Docker is preinstalled on
    # ubuntu-latest; the harness starts disposable Bitcoin + Liquid regtest
    # services and tears them down when the lane exits.
    if: github.event_name == 'schedule' && github.event.schedule == '47 3 * * 0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-workspace

      # The harness drives this binary; its own helpers are stdlib Python on
      # the runner's python3.
      - name: Build the kassiber binary
        run: cargo build --locked --release -p kassiber

      - name: Generated-truth demo oracle
        run: ./scripts/integration-harness.sh demo-full

  docker-lane:
    # Heavy Docker lanes are manual-only. Docker is preinstalled on ubuntu-latest;
    # the harness generates disposable regtest RPC credentials per run and sets
    # KASSIBER_INTEGRATION=1 itself.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fetch pinned test data
        shell: bash
        run: scripts/fetch-test-data.sh

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-workspace

      # The harness drives this binary; its own helpers are stdlib Python on
      # the runner's python3.
      - name: Build the kassiber binary
        run: cargo build --locked --release -p kassiber

      - name: Integration lane (${{ github.event.inputs.lane }})
        run: ./scripts/integration-harness.sh "${{ github.event.inputs.lane }}"
