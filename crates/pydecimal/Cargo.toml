[package]
name = "kassiber-pydecimal"
description = "CPython-exact decimal arithmetic for Kassiber's Rust crates"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "kassiber_pydecimal"

[dependencies]
# Arbitrary-precision coefficients. num-integer and num-traits are
# num-bigint's own dependencies; the crate uses their traits directly.
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
