[package]
name = "kassiber-pyjson"
description = "CPython-exact json.dumps output and float repr for Kassiber's Rust crates"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "kassiber_pyjson"

[dependencies]
# str(Decimal) for values dumped with default=str.
kassiber-pydecimal = { path = "../pydecimal" }
# Python ints are unbounded; num-bigint already backs kassiber-pydecimal.
num-bigint = "0.4"
