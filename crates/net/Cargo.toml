[package]
name = "kassiber-net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Consent-bound network routes and RAM-only egress observation for Kassiber"

[dependencies]
base64 = "0.22"
httparse = "1.10"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
url = "2.5"
# Endpoints require reviewed ASCII A-labels; do not pull in ICU/Unicode mapping.
idna_adapter = { version = "~1.0", default-features = false }
webpki-roots = "1"
kassiber-envelope = { path = "../envelope" }

# The AI provider broker's process group: killpg, getuid and access(X_OK)
# through nix's safe wrappers, as kassiber-paths already uses it.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "user", "fs"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
# Parse Cargo policy without ad-hoc TOML line matching. No production dependency.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

[features]
# Only harness binaries may enable this. An armed environment without this
# feature (or cfg(test)) terminates with EX_CONFIG rather than running unguarded.
test-observer = []
# Owned loopback fakes for downstream service tests; never product builds.
test-support = []

[lints.rust]
unsafe_code = "forbid"
