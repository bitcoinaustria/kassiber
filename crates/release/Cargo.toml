[package]
name = "kassiber-release"
description = "Explicit GitHub update checks, offline release verification, and the release tool"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
kassiber-envelope = { path = "../envelope" }
kassiber-net = { path = "../net", optional = true }
kassiber-paths = { path = "../paths" }
kassiber-pyjson = { path = "../pyjson" }
kassiber-pytext = { path = "../pytext" }
kassiber-setup = { path = "../setup", optional = true }
kassiber-store = { path = "../store", optional = true }
# Already locked by the chain, backup and ownership crates.
base64 = "0.22"
sha2 = "0.11"
# OpenSSH SSHSIG signed data and Ed25519 verification (through ed25519-dalek)
# in process, replacing `ssh-keygen -Y verify`; verification features only.
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "ed25519"] }
# The `Verifier` trait ssh-key implements but does not re-export; already locked.
signature = { version = "=2.2.0", default-features = false }
# The release tool's macOS steps, all already locked by the workspace: the
# property lists Apple's tools print (plist, via typst's syntect), the app
# ZIP's member checks (zip, as crates/xlsx), and the CLI .tar.gz (tar and
# flate2, as crates/backup and crates/wallets).
plist = { version = "=1.10.3", default-features = false }
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }

[features]
default = ["update"]
# `kassiber update`'s GitHub check. The release tool (`kassiber-release`)
# builds with `--no-default-features`, so release jobs compile neither the
# network stack nor SQLCipher.
update = ["dep:kassiber-net", "dep:kassiber-setup", "dep:kassiber-store"]

[target.'cfg(unix)'.dependencies]
# Already locked by kassiber-paths; only the libc re-export is used.
nix = { version = "0.30", features = ["fs"] }

[[test]]
name = "vectors"
required-features = ["update"]

[[bin]]
name = "kassiber-release"
path = "src/bin/kassiber-release/main.rs"

[lints.rust]
unsafe_code = "forbid"
