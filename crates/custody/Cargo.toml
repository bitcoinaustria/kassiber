[package]
name = "kassiber-custody"
version = "0.1.0"
description = "Pure custody computation from versioned raw accounting facts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
kassiber-pydecimal = { path = "../pydecimal" }
kassiber-pyjson = { path = "../pyjson" }
# Existing JSON boundary libraries; preserve raw mapping insertion order and
# exact integers, and parse float literals with CPython's correctly rounded value.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "float_roundtrip"] }
# std has no SHA-256; persisted observer/evidence commitments require it.
sha2 = "0.10"
