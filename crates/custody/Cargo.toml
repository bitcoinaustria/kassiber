[package]
name = "kassiber-custody"
version = "0.1.0"
description = "Pure custody computation from versioned raw accounting facts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
kassiber-tax-countries = { path = "../tax-countries" }
kassiber-pydecimal = { path = "../pydecimal" }
kassiber-pyjson = { path = "../pyjson" }
# Existing JSON boundary libraries; retain exact integers and parse float literals with CPython's
# correctly rounded value. raw_value keeps unported v1 fragments ordered without
# a second Value tree; it adds no dependency or external I/O.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "raw_value"] }
# std has no SHA-256; persisted observer/evidence commitments require it.
sha2 = "0.10"
# Legacy HTLC witness replay needs HASH160; std and sha2 have no RIPEMD160.
bitcoin_hashes = "0.14.101"

[features]
# Opt-in `Instant` spans for performance work; never enabled by the binding.
timing = []

[[example]]
name = "custody-bench"
required-features = ["timing"]
[dev-dependencies]
# The private fusion probe invokes the existing ledger; product custody remains independent.
kassiber-tax-core = { path = "../../tax-engine/core" }
