[package]
name = "kassiber-ipc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Same-user local IPC and child-process primitives: AF_UNIX sockets, Windows named pipes, explicit handle inheritance"

# The only crate allowed `unsafe` code (docs/reference/r6-ai-operator-port.md,
# R6-1): peer credentials, named pipes, handle lists and signal handlers need
# it. Every block carries a SAFETY comment; other R6 crates forbid unsafe.

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
