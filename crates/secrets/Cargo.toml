[package]
name = "kassiber-secrets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Zeroized database unlock and Python-compatible native credential lookup"

[dependencies]
kassiber-paths = { path = "../paths" }
kassiber-ownership = { path = "../ownership" }
keyring-core = "=1.0.0"
sha2 = "0.10"
serde_json = "1"
zeroize = "1"
# std has no portable, restoring no-echo terminal prompt.
rpassword = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.0", features = ["rt-tokio-crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.0", features = ["keychain"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.0.0"
