[package]
name = "kassiber-secrets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Zeroized database unlock, encryption commands and Python-compatible native credentials"

[features]
default = []
test-hooks = []
# Native storage is an explicit shell capability. Pure core/unlock builds do
# not need to link a D-Bus client or an async runtime for descriptor input.
native-keyring = ["dep:keyring-core", "dep:zbus-secret-service-keyring-store", "dep:apple-native-keyring-store", "dep:windows-native-keyring-store"]

[dependencies]
kassiber-paths = { path = "../paths" }
kassiber-ownership = { path = "../ownership" }
kassiber-store = { path = "../store" }
kassiber-envelope = { path = "../envelope" }
kassiber-pyjson = { path = "../pyjson" }
kassiber-pytext = { path = "../pytext" }
keyring-core = { version = "=1.0.0", optional = true }
sha2 = "0.11"
serde_json = "1"
zeroize = "1"
# std has no portable, restoring no-echo terminal prompt.
rpassword = "7"
# std has no portable cryptographic source for credential enrollment IDs.
getrandom = "=0.4.3"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.0", optional = true, features = ["rt-tokio-crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.0", optional = true, features = ["keychain"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.0.0", optional = true }

[[example]]
name = "kassiber-secrets-probe"
path = "examples/probe.rs"
required-features = ["test-hooks"]
