[package]
name = "kassiber-pytext"
description = "CPython's str.isspace/strip, repr(str), int()/float() parsing, and json.loads errors for Kassiber's Rust crates"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "kassiber_pytext"

[dependencies]
# json.loads builds the same Python-shaped values json.dumps writes.
kassiber-pyjson = { path = "../pyjson" }
num-bigint = "0.4"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
# Reads the CPython vectors; already locked for the tax engine.
serde_json = "1"
