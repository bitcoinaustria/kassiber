[package]
name = "kassiber-session-replay"
description = "Development tool: records product processes once and replays them against the binary"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# All already in the workspace: JSON session files, content-addressed blobs,
# and database dumps through the store's SQLCipher build.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"
regex = "1"
rusqlite = { version = "=0.40.1", features = ["bundled-sqlcipher"] }

[dev-dependencies]
tempfile = "3"
