[package]
name = "kassiber-envelope"
description = "Kassiber's machine envelope, error type, kind derivation, and redaction"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "kassiber_envelope"

[dependencies]
kassiber-pyjson = { path = "../pyjson" }
kassiber-pytext = { path = "../pytext" }
# The redaction rules use lookbehind and lookahead (and Python's Unicode \b
# and $ are emulated with lookarounds), which the regex crate alone cannot
# express; fancy-regex adds a backtracking layer over it.
fancy-regex = "0.20"

[dev-dependencies]
# Reads the Python-produced golden vectors; already locked for the tax engine.
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
