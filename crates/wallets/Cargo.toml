[dependencies]
kassiber-chain = { path = "../chain" }
kassiber-net = { path = "../net" }
kassiber-envelope = { path = "../envelope" }
kassiber-pyjson = { path = "../pyjson" }
kassiber-pytext = { path = "../pytext" }
kassiber-pydecimal = { path = "../pydecimal" }
kassiber-custody = { path = "../custody" }
kassiber-paths = { path = "../paths" }
kassiber-store = { path = "../store" }
kassiber-setup = { path = "../setup" }
# Reuse managed evidence storage and its validator; do not add a blob store.
kassiber-transactions = { path = "../transactions" }
# Audited descriptor grammars, BIP32, script construction and confidential
# address cryptography cannot be safely replaced with standard-library code.
bitcoin = "0.32"
miniscript = "12"
elements-miniscript = "0.4"
# Match bdkpython 3.0.0's wallet/index/update semantics. The protocol adapters
# are deliberately absent: their connectors would bypass kassiber-net.
bdk_wallet = { version = "=3.0.0", default-features = false, features = ["std"] }
bdk_chain = { version = "=0.23.3", default-features = false, features = ["std"] }
bdk_core = { version = "=0.6.3", default-features = false, features = ["std"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
regex = "1"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
kassiber-net = { path = "../net", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

