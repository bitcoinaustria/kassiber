[package]
name = "kassiber-wallets"
description = "Local wallet identity and lifecycle services"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Guarded differential driver only; never enabled by a production binary.
test-harness = ["kassiber-net/test-observer"]

[[example]]
name = "discovery_fixture"
required-features = ["test-harness"]

[[example]]
name = "acquisition_fixture"
required-features = ["test-harness"]

[[example]]
name = "observer_state_fixture"
required-features = ["test-harness"]

[dependencies]
kassiber-chain = { path = "../chain" }
kassiber-net = { path = "../net" }
kassiber-envelope = { path = "../envelope" }
kassiber-pyjson = { path = "../pyjson" }
kassiber-pytext = { path = "../pytext" }
kassiber-pydecimal = { path = "../pydecimal" }
kassiber-custody = { path = "../custody" }
kassiber-paths = { path = "../paths" }
kassiber-store = { path = "../store" }
# Audited descriptor grammars, BIP32, script construction and confidential
# address cryptography cannot be safely replaced with standard-library code.
bitcoin = "0.32"
miniscript = "12"
elements-miniscript = "0.4"
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
regex = "1"

[dev-dependencies]
kassiber-net = { path = "../net", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"
