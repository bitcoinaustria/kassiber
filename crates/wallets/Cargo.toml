[package]
name = "kassiber-wallets"
description = "Local wallet identity and lifecycle services"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Guarded differential driver only; never enabled by a production binary.
# The AI clock lets a driver pin provider timestamps (KASSIBER_RUST_TEST_AI_TIME).
test-harness = ["kassiber-net/test-observer", "kassiber-ai/test-harness"]

[[example]]
name = "freshness_fixture"
required-features = ["test-harness"]

# Replays of the freshness parity tests; they run the fixture in process.
[[test]]
name = "freshness"
path = "tests/freshness/main.rs"
required-features = ["test-harness"]

