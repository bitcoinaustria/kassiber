[package]
name = "kassiber-credentials"
description = "Withholds the credentials a request carried from text a server or tool sends back, byte for byte as kassiber/redaction.py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "kassiber_credentials"

[dependencies]
# Python's JSON string escaping, str.strip and str.lower, exactly.
kassiber-pyjson = { path = "../pyjson" }
kassiber-pytext = { path = "../pytext" }

[dev-dependencies]
# Reads the Python-produced vectors; already locked for the tax engine.
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
