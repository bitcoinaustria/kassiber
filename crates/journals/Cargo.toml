[package]
name = "kassiber-journals"
version = "0.1.0"
description = "The journal pipeline: custody, fusion and the tax engine in one process"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
kassiber-custody = { path = "../custody" }
kassiber-pyjson = { path = "../pyjson" }
kassiber-tax-core = { path = "../../tax-engine/core" }
# The custody stage model; the same features as kassiber-custody.
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip"] }

[features]
# Opt-in `Instant` spans (custody's recorder); never enabled by a product build.
timing = ["kassiber-custody/timing"]

[[example]]
name = "journals-bench"
required-features = ["timing"]
