[package]
name = "kassiber-journals"
description = "Pure journal rendering and joins over finalized custody and ledger results"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
kassiber-custody = { path = "../custody" }
kassiber-envelope = { path = "../envelope" }
kassiber-pydecimal = { path = "../pydecimal" }
kassiber-pyjson = { path = "../pyjson" }
kassiber-pytext = { path = "../pytext" }
kassiber-store = { path = "../store" }
kassiber-wallets = { path = "../wallets" }
kassiber-tax-core = { path = "../../tax-engine/core" }
# Reuse the book's SQLCipher driver and existing Python-compatible timestamp
# parser; neither the standard library nor the renderer supplies these.
kassiber-store = { path = "../store" }
kassiber-rates = { path = "../rates" }
kassiber-reports = { path = "../reports" }
kassiber-wallets = { path = "../wallets" }
# UUIDv5 resolution identities need SHA-1; reuse the locked Bitcoin hash crate.
bitcoin_hashes = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"

[features]
timing = ["kassiber-custody/timing"]
test-harness = []

[[example]]
name = "custody-load"
required-features = ["test-harness"]

[[example]]
name = "journals-bench"
required-features = ["timing"]
