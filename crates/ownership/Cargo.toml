[package]
name = "kassiber-ownership"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Python-compatible canonical project ownership leases"

[dependencies]
kassiber-paths = { path = "../paths" }
kassiber-pyjson = { path = "../pyjson" }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["user", "fs"] }

[dev-dependencies]
tempfile = "3"
kassiber-ipc = { path = "../ipc" }
