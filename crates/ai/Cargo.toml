[package]
name = "kassiber-ai"
description = "Kassiber's in-product AI tools: the catalog, selection, validation, redaction, consent, auto-reads and provenance"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "kassiber_ai"

[features]
# Test builds only: fixed clocks for the differential drivers.
test-harness = []

[dependencies]
kassiber-envelope = { path = "../envelope" }
# Provider configuration, discovery and the HTTP client (R6-6a).
kassiber-net = { path = "../net" }
kassiber-paths = { path = "../paths" }
kassiber-store = { path = "../store" }
kassiber-setup = { path = "../setup" }
sha2 = "0.11"
kassiber-pyjson = { path = "../pyjson" }
kassiber-pytext = { path = "../pytext" }
# Python `re` patterns (schema `pattern`, the planner's word rules and the
# result path/URL scrubbers), as kassiber-envelope's redaction compiles them.
fancy-regex = "0.20"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
# The scripted loopback provider the transport suites run against.
kassiber-net = { path = "../net", features = ["test-support"] }
