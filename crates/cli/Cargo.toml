[package]
name = "kassiber-cli"
description = "Kassiber's command line: argparse grammar, global flags, and command dispatch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "kassiber_cli"

[dependencies]
kassiber-daemon = { path = "../daemon" }
kassiber-envelope = { path = "../envelope" }
kassiber-pyjson = { path = "../pyjson" }
kassiber-pytext = { path = "../pytext" }
kassiber-runtime = { path = "../runtime" }
# argparse's usage formatter and textwrap split text with lookaround
# patterns; the same engine the redaction rules use.
fancy-regex = "0.20"

[dev-dependencies]
kassiber-runtime = { path = "../runtime", features = ["fake"] }

[lints.rust]
unsafe_code = "forbid"

[features]
# Test builds only: KASSIBER_RUST_TEST_PROBE (see `Environment::test_probe`).
test-probe = []
