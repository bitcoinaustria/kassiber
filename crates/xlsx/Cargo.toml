[package]
name = "kassiber-xlsx"
description = "Deterministic in-memory rendering of Kassiber report workbooks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# No std/workspace implementation of OOXML, cached formulas or workbook styles.
# No optional clock, filesystem, autofit, decimal, serialization or zlib features.
rust_xlsxwriter = { version = "=0.102.0", default-features = false }
serde = { version = "1", features = ["derive"] }
# Already rust_xlsxwriter's dependency. Repair its pixel-quantized row heights
# to Python's exact point heights without a second OOXML implementation.
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"
