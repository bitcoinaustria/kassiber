[package]
name = "kassiber-transactions"
description = "Local transaction metadata, evidence and loan services shared by the CLI and daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
kassiber-tax-countries = { path = "../tax-countries" }
kassiber-envelope = { path = "../envelope" }
kassiber-paths = { path = "../paths" }
kassiber-pydecimal = { path = "../pydecimal" }
kassiber-pyjson = { path = "../pyjson" }
kassiber-pytext = { path = "../pytext" }
kassiber-store = { path = "../store" }
sha2 = "0.11"
fancy-regex = "0.20"

[features]
# Test builds only: KASSIBER_RUST_TEST_REPORT_TIME pins the "now" an empty
# transaction page takes its year from. Never in a release build.
test-harness = []

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
