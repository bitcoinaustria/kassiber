# Kassiber's Rust workspace (docs/plan/21-rust-backend.md): the tax engine
# and the backend crates. ui-tauri/src-tauri is its own workspace on the same
# toolchain (rust-toolchain.toml).
[workspace]
# Cargo would otherwise claim ui-tauri/src-tauri as an undeclared member.
exclude = ["ui-tauri"]
resolver = "2"
members = [
  "crates/cli",
  "crates/chain",
  "crates/setup",
  "crates/custody",
  "crates/daemon",
  "crates/envelope",
  "crates/kassiber",
  "crates/imports",
  "crates/net",
  "crates/rates",
  "crates/paths",
  "crates/ownership",
  "crates/store",
  "crates/transactions",
  "crates/secrets",
  "crates/pydecimal",
  "crates/pyjson",
  "crates/pytext",
  "crates/runtime",
  "crates/wallets",
  "tax-engine/core",
  "tax-engine/python",
]

[workspace.package]
edition = "2021"
# The repository's pinned toolchain (rust-toolchain.toml), which also builds
# ui-tauri/src-tauri.
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["Bitcoin Austria"]
publish = false

[profile.release]
# A panic is a bug; keep unwinding so the binding can turn it into an error.
panic = "unwind"
