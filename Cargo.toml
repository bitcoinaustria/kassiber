# Kassiber's Rust workspace (docs/plan/21-rust-backend.md): the tax engine
# and the backend crates. ui-tauri/src-tauri is its own workspace on the same
# toolchain (rust-toolchain.toml).
[workspace]
# Cargo would otherwise claim ui-tauri/src-tauri as an undeclared member.
exclude = ["ui-tauri"]
resolver = "2"
members = [
  "crates/ai",
  "crates/backup",
  "crates/cli",
  "crates/chain",
  "crates/setup",
  "crates/custody",
  "crates/daemon",
  "crates/diagnostics",
  "crates/envelope",
  "crates/kassiber",
  "crates/imports",
  "crates/journals",
  "crates/net",
  "crates/rates",
  "crates/release",
  "crates/paths",
  "crates/ownership",
  "crates/ipc",
  "crates/operator",
  "crates/store",
  "crates/transactions",
  "crates/transfers",
  "crates/secrets",
  "crates/pydecimal",
  "crates/pyjson",
  "crates/pytext",
  "crates/runtime",
  "crates/xlsx",
  "crates/reports",
  "crates/wallets",
  "crates/workspace",
  "tax-engine/core",
  "tax-engine/python",
]

[workspace.package]
edition = "2021"
# The repository's pinned toolchain (rust-toolchain.toml), which also builds
# ui-tauri/src-tauri.
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["Bitcoin Austria"]
publish = false

[profile.release]
# A panic is a bug; keep unwinding so the binding can turn it into an error.
panic = "unwind"

# age calibrates scrypt from elapsed CPU time. Unoptimized crypto can otherwise
# reject ordinary pyrage/release-built bundles as excessive work in the native
# debug/parity binary. Keep calibration on the same optimized primitives.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
